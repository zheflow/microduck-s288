# printability.yaml —— 第 1 层「可打印」的全部"应该是什么"。
#
# 字段约定同 tools/gate/data/README.md：
#   · 数值字段写成 {v: <值>, src: measured|datasheet|assumed}，拿不到就 v: null + unknown_reason
#   · 每条给 provenance
# 单位：mm / mm² / mm³ / deg。不四舍五入。
#
# 为什么这个文件存在：l1_printable.py 里**不许出现任何零件专用的数字**。
# 换喷嘴、换材料、换朝向、换禁撑特征种类，只改这里，检查器一行不动。
# 件的打印朝向不在这里，在 parts.yaml:print_orientation_down_normal（跟着件走）。

schema_version: 1

source:
  print_params_doc: "V2_S288版发布产物/01_整鸭打印件/打印清单与参数.md:60（本轮实际切片参数那一行）"
  slicer_argv: "tools/gate/slicing/slice_l1.py:SETTINGS（逐字沿用 docs/repair_2026-09-09/slice_final.py 的实参）"
  readme_criteria: "tools/gate/README.md 第 2 节 L1：最薄壁 ≥2 圈 · 最小孔 ≥2×喷嘴 · 悬垂 >55° 的面在支撑可拆区 · 支撑不落在配合面/孔内 · TPU 单独规则"

# ── 工艺参数（真实切片用的那一套，不是想象的）──────────────────────────────
process:
  nozzle_d_mm: {v: 0.4, src: measured, src_note: "打印清单与参数.md:60『0.4mm喷嘴』；= slicer 实参 --nozzle-diameter 0.4"}
  layer_h_mm: {v: 0.2, src: measured, src_note: "打印清单与参数.md:60『0.2mm层高』；= slicer 实参 --layer-height 0.2"}
  first_layer_h_mm: {v: 0.2, src: measured, src_note: "slicer 实参 --first-layer-height 0.2"}
  perimeters_configured: {v: 3, src: measured, src_note: "打印清单与参数.md:60『3道墙』；= slicer 实参 --perimeters 3"}
  top_bottom_solid_layers: {v: 4, src: measured, src_note: "打印清单与参数.md:60『4层顶底』"}
  fill_density_percent_default: {v: 40, src: measured, src_note: "打印清单与参数.md:60『40%填充』"}
  fill_density_percent_60: {v: 60, src: measured, src_note: "打印清单与参数.md:60『L03/L04/L05/L07/T01为60%』"}
  brim_width_mm: {v: 3, src: measured, src_note: "打印清单与参数.md:60『3mm裙边』；= slicer 实参 --brim-width 3"}
  support: {v: "auto", src: measured, src_note: "打印清单与参数.md:60『自动支撑』；= --support-material --support-material-auto --support-material-style snug"}
  perimeter_generator_default: {v: "arachne", src: measured, src_note: "打印清单与参数.md:60『N02为Classic，其余为Arachne』"}
  perimeter_generator_overrides:
    N02: {v: "classic", src: measured, src_note: "打印清单与参数.md:60 + slice_final.py：N02 用 Classic 绕开复现过的 Arachne 报错"}
  # 挤出宽度不是喷嘴直径 —— 判"能不能放下 N 圈墙"必须用挤出宽度，用 0.4 会算宽 11%。
  wall_line_width_mm:
    v: 0.45
    src: measured
    src_note: "从本轮真实 G-code 表头逐件读出：'; external perimeters extrusion width = 0.45mm' / '; perimeters extrusion width = 0.45mm'（17/17 件一致）"
  first_layer_line_width_mm: {v: 0.40, src: measured, src_note: "G-code 表头 '; first layer extrusion width = 0.40mm'"}
  support_line_width_mm: {v: 0.40, src: measured, src_note: "G-code 表头 '; support material extrusion width = 0.40mm'"}
  support_material_spacing_mm:
    v: 2.5
    src: measured
    src_note: "tools/gate/slicing/logs/*_profile.ini:support_material_spacing = 2.5（切片器自己存的实参，17/17 件一致）。
               支撑是稀疏填充：平面填充率 ≈ support_line_width_mm / support_material_spacing_mm = 0.40/2.5 = 0.16，
               所以『模型占据体积』和『切片器挤出体积』本来就差一个这个量级，不能直接比。" 

# ── 判据（阈值）────────────────────────────────────────────────────────────
criteria:
  min_wall_perimeters:
    v: 2
    src: assumed
    src_note: "README 第 2 节 L1『最薄壁 ≥2 圈』。判据 = min_wall_perimeters × wall_line_width_mm = 2×0.45 = 0.90 mm。
               另记 2×喷嘴 = 0.80 mm 作为宽松读法，两个数都报，判据取 0.90（挤出宽度才是打印机真会走的线宽）。"
    calibration_2026-09-12:
      result: "用同一判据（0.90 / 面积≥0.5 / 连续≥3 层）判 16 件**已被 Pollen 原版和 AI-FanGe 复刻实打实打出来、走起来**的原版件（按复刻 3MF 的打印朝向，
               朝向由 docs/probes_2026-09-12/参考对比/orient_icp.py 把 3MF 件 ICP 配回原版网格得到；09-12 第一版用错了轴系，09-13 复审后重算）：**11/16 红**。
               头顶壳竖打 371/613 层（最长连续 197）、底壳 80/101（75）、neck_pitch 26/138（26）、upper_leg 10/140（10）、power_support 17/85（9）、
               yaw_roll_motion 12/112（9）、motor_support 7/94（7）、hip_l 9/173（6）、left/right_shell 6/169、5/159（5/4）、leg 7/40（3）；
               绿的 5 件：jaw、yaw2roll、face_part、bearing_roll、1 mm 刚性板。同一批件复刻用 2 圈 0.42 mm 墙（classic、detect_thin_wall=0）打出来是好的。"
      conclusion: "这个 2D 开运算指标量到的东西（圆角切点、CSG 刀刃、0.6~0.85 的薄唇、字/筋）不是『挤不挤得出来』的边界：
                   Arachne 会把 0.6~0.85 的墙分成两条细 bead，classic 会走 1 bead + gap fill，两者都能成形。
                   所以 min_wall_geometric 不能当 BLOCK 判据用 —— 2026-09-12 降为 WARN（照量照报，可按输入 hash 豁免）；
                   真正的墙数判据由 min_wall_sliced（真 G-code 的 layers_single_bead）承担，它仍是 BLOCK。"
      evidence: "docs/probes_2026-09-12/参考对比/gate_min_wall_calibration.json（gate_calib_orig.py 复现）"
      not_changed: "阈值 2×0.45 与 thin_region_* 原样保留：没有数据支持一个『能分开好坏』的新阈值（合格件的最薄壁从 <0.04（壳的 CSG 刀刃）到 1.5 都有，红件最长连续 3..197 层）。
                    要真做阈值，得用切片器对这 20 件出 layers_single_bead —— PrusaSlicer 的 dmg 挂载点随关机丢了，重挂后再跑。"
  min_hole_check:
    feature_kind_substrings: ["hole", "bore"]
    src_note: "README 第 2 节 L1『最小孔 ≥2×喷嘴』。规则只按 kind 里含不含这两个子串取特征
               （screw_hole/pilot_hole/horn_hole/bore/bearing_bore/counterbore），
               换件新增孔种类只要 kind 里带 hole/bore 就自动被查到，检查器不用改。"
  min_hole_nozzle_multiple:
    v: 2
    src: assumed
    src_note: "README 第 2 节 L1『最小孔 ≥2×喷嘴』→ 2×0.4 = 0.80 mm 名义直径下限"
  overhang_angle_from_vertical_deg:
    v: 55
    src: assumed
    src_note: "README 第 2 节 L1『悬垂 >55°』。定义：面法向 n（朝外，单位）的朝下分量 d = −n_z，
               悬垂角 = asin(clamp(d,0,1))，竖直墙 = 0°，水平天花板 = 90°。>55° 记为悬垂面。"
  support_model_overhang_deg:
    v: 45
    src: measured
    src_note: "支撑模型**必须用切片器的实参**（--support-material-threshold 45），不能用 README 的 55。
               45° 比 55° 更早开始生成支撑 → 45..55° 那一带的面切片器真会撑，用 55 建模会漏掉这部分支撑，
               于是『支撑落进孔里』可能假绿。这里取 45 是保守方向（多算支撑，不少算）。"
  support_min_overhang_width_mm:
    v: 0.45
    src: measured
    src_note: "= process.wall_line_width_mm。比一条挤出线还窄的无支承边缘由外圈墙自己挑着
               （切片器把它走成 Overhang perimeter），不会为它生成支撑。支撑模型里对无支承区
               先按这个宽度做一次开运算，否则每一圈 0.1 mm 的台阶都会长出一根假柱子。"
  thin_region_min_area_mm2:
    v: 0.5
    src: assumed
    src_note: "形态学开运算的噪声底。开运算按半径 r 必然削掉每个凸直角约 r²(1−π/4)=0.0435r² mm²
               （r=0.45 时 0.0088 mm²/角），那是圆角化不是薄壁。取 0.5 mm²≈57 倍单角损失作噪声底：
               一条 10 mm 长 0.5 mm 厚的薄筋损失约 5 mm²，与噪声相差一个量级。两个数（过滤前/过滤后）都报。"
  thin_region_min_layers:
    v: 3
    src: assumed
    src_note: "薄壁是**三维**特征：至少连续这么多层都薄才算壁。只在 1–2 层出现的刀刃状截面，
               是层平面与曲面相切（圆角/球面/斜面的切点附近）的产物 —— 实测 L05 在 r=0.02 时
               只有孤立单层命中（最长连续 1 层），到 r=0.1 才连成 8 层。
               不加这一条，任何带圆角的件『最薄壁』都会报成 0.04 mm，那是量错了对象。
               每层原始命中数照报，不藏。"
  forbidden_zone_axial_margin_mm:
    v: 0.2
    src: assumed
    src_note: "= 一个层高。禁撑柱体按声明的 axial_span 两端各外扩这么多：盲孔底面的支撑疤在孔底**下一层**，
               不外扩就量不到落在孔底的那一层支撑。"
  support_in_forbidden_max_mm3:
    v: 0.05
    src: assumed
    src_note: "README 第 2 节 L1『支撑不落在配合面/孔内』—— 判据本身是『不许落进去』。
               0.05 mm³ 只是**数值噪声底**，沿用 README 第 2 节 L3 对布尔交集用的同一个数
               （缓冲/多边形取交在孔壁上会留下 0.0x mm² × 一两层的毛刺，实测 L02/N01 的下界
               分别是 0.0027 / 0.0047 mm³，就是这种毛刺）。命中体积和落在哪条特征上照报，不藏。
               09-13 起它只用于 support_model_zone_crosscheck（2D 模型 vs 真 G-code 的交叉核对）；
               判据本体改按真 G-code 采样点数（support_landing_forbid_max_samples）。"
  # ── 真 G-code 支撑落点（09-13 审计 F-L1-3 落地版；slice_l1.py 采样、l1_printable.py 判）──
  support_landing_sample_step_mm:
    v: 0.2
    src: assumed
    src_note: "沿每段支撑挤出线每 0.2 mm 取一点（含端点），点数×0.2 ≈ 支撑路径 mm。= 一个层高 / 半个挤出宽度：
               比支撑线宽 0.40 细一半，一条线穿过 Ø2.4 孔至少落 12 个点，不会漏掉穿孔的细柱；
               与 docs/probes_2026-09-12/geometry_investigation/真切片支撑落点_2026-09-13.md 的采样口径一致（那张表 ÷5 ≈ mm）。
               slice_l1.py 读这个数，记进 slice_run.parts.<件>.support_landing.sample_step_mm；层核对不等 → unknown。"
  support_landing_forbid_max_samples:
    v: 0
    src: assumed
    src_note: "README 第 2 节 L1『支撑不落在配合面/孔内』—— forbid 级禁撑区里**一个采样点都不许有**。
               不设噪声底：采样点是 G-code 里真实的挤出坐标，不是布尔毛刺；柱体两端已按 forbidden_zone_axial_margin_mm 外扩，
               落在孔口外一层的点本来就该算。measured 报折算路径 mm（点数×步长）。"
  first_layer_min_area_mm2:
    v: null
    src: null
    unknown_class: not_measured
    unknown_reason: "没有本机首层附着实测。3 mm 裙边已启用，但『多大贴床面积配多宽裙边才不翘边』是设备+料盘+床面
                     三者的经验值，本项目没有试件（08_公差试件 只有配合试件，没有附着试件）。
                     要解开：打一组不同贴床面积的试片，记录翘边阈值，把数填进这里并标 measured。"
  min_bridge_anchor_sides:
    v: 2
    src: assumed
    src_note: "桥接豁免的必要条件之一：无支承区两侧都要有下一层的锚点。"
  max_bridge_span_mm:
    v: null
    src: null
    unknown_class: not_measured
    unknown_reason: "没有本机/本料的桥接跨距实测。→ 本层**不做任何桥接豁免**，一律当成需要支撑。
                     这是保守方向：算出来的支撑范围是上界，所以『支撑没落进禁撑区』这个结论成立时是可信的；
                     只有当结论是『落进去了』时才需要桥接数据来细化。
                     要解开：打桥接梯度试件（5/10/15/20 mm 跨距），记录不塌的最大跨距。"

# ── 材料专项 ───────────────────────────────────────────────────────────────
# 换材料只改这一节。PLA 的数来自本轮真实切片；TPU 没有任何本项目实测 → 全部 null，判红。
materials:
  PETG:
    applies_to_parts_material: "PETG"
    # 2026-09-16 用户定整鸭换 PETG。下面三条是**从 PLA 搬过来的假设**（PETG 没有本项目实测；试件包已发、待打）：
    #   · 壁厚圈数与悬垂角按同一判据（PETG 悬垂/桥接通常比 PLA 差 → 55° 是偏乐观的一侧，marginal）
    #   · 支撑可拆：PETG 与支撑界面比 PLA 粘 → 不敢写 true，记 not_measured
    #   · 切片实参照旧（层高/线宽/周界数/密度 1.27 都不变，温度不影响几何指标）；slice_run 换料后重切
    min_wall_perimeters: {v: 2, src: assumed, src_note: "= criteria.min_wall_perimeters；PETG 未实测，沿用 PLA 判据"}
    overhang_angle_from_vertical_deg: {v: 55, src: assumed, src_note: "= criteria.overhang_angle_from_vertical_deg；PETG 悬垂通常不如 PLA，此值偏松，待 PETG 悬垂试件"}
    supports_removable:
      v: null
      src: null
      unknown_class: not_measured
      unknown_reason: "PETG 上自动支撑能否拆净没有实测（PETG 支撑界面比 PLA 粘）。要解开：PETG 试件包里任一带支撑件打完看。"
    sliced_this_run: true
    xy_shrink_note: "孔径缩水按 PLA 孔规 0.20–0.25/边（tolerances.yaml 09-16）；PETG 值待 TC02 重打后另立"
  PLA:
    applies_to_parts_material: "PLA"
    min_wall_perimeters: {v: 2, src: assumed, src_note: "= criteria.min_wall_perimeters"}
    overhang_angle_from_vertical_deg: {v: 55, src: assumed, src_note: "= criteria.overhang_angle_from_vertical_deg"}
    supports_removable: {v: true, src: assumed, src_note: "本轮 17/17 件都按 --support-material-auto 真切过，切片器无告警"}
    sliced_this_run: true
  "TPU 95A":
    applies_to_parts_material: "TPU 95A"
    min_wall_perimeters:
      v: null
      src: null
      unknown_class: not_measured
      unknown_reason: "TPU 95A 的最小可打印壁厚没有本项目实测。软料挤出会胀、回抽会拉丝，
                       PLA 的 2 圈 0.90 mm 不能直接搬。要解开：打 TPU 壁厚梯度试件。"
    overhang_angle_from_vertical_deg:
      v: null
      src: null
      unknown_class: not_measured
      unknown_reason: "TPU 的悬垂极限没有实测。要解开：打 TPU 悬垂梯度试件（30/45/55/65°）。"
    supports_removable:
      v: null
      src: null
      unknown_class: not_measured
      unknown_reason: "TPU 上的支撑能不能拆干净没有实测 —— 软料和支撑界面容易粘死，
                       parts.yaml:L06.supports 本来就写的是『—（TPU 工艺未标定）』。
                       本轮 L06 是按 PLA 参数切的（同一份 slicer 实参），那份 G-code 对 TPU **不作数**。"
    sliced_this_run: false
    sliced_note: "L06 本轮用 PLA 的实参切过一次，只用来取几何指标（层数/首层面积），
                  不得当作 TPU 工艺已验证。速度/温度/回抽全未标定。"

# ── 禁撑区：支撑落进去就红 ────────────────────────────────────────────────
# 规则只认这里列的 feature kind，不认件号。换件只改这份清单。
no_support_zones:
  from_features_yaml_kinds:
    - screw_hole
    - pilot_hole
    - horn_hole
    - bore
    - bearing_bore
    - counterbore
    - journal
    - slide_corridor
    - spot_face
    - tool_channel
  why: "README 第 2 节 L1『支撑不落在配合面/孔内』。孔里、轴颈上、滑配走廊里留支撑疤 =
        螺丝拧不进 / 轴承压不进 / 滑配卡死。"
  # ── 09-13 两级分级（l1_printable.no_support_zone_set 读；from_features_yaml_kinds 必须 = forbid.kinds ∪ removable.kinds，
  #    层核对不等就判 unknown —— 旧读法不许悄悄失效）。判据本体改按真 G-code 采样点（见 criteria.support_landing_*）。
  tiers:
    forbid:
      kinds: [bearing_bore, journal, spot_face]
      also: "slide_corridor 的 geom.mating_shells_export_local（配合面 0.5 mm 壳层，features.yaml L01-F13 / L03-F05）一律 forbid"
      severity: BLOCK
      check: support_in_no_support_zone
      why: "支撑疤直接毁配合：轴承外圈压不进座 / 轴颈卡死 / 锪平坐面不平让螺丝头偏心预紧；
            舵机口袋配合面壳层里的疤 ≥ 滑配间隙（servo_slide 0.2 / servo_envelope 0.3）就把舵机滑入堵死或顶歪。"
      src: "docs/probes_2026-09-12/geometry_investigation/真切片支撑落点_2026-09-13.md §3.1『必须干净』"
    removable:
      kinds: [screw_hole, pilot_hole, horn_hole, counterbore, tool_channel, bore, slide_corridor]
      severity: WARN
      check: support_in_removable_zone
      why: "拆掉支撑、按 post_process 清理后配合不受影响；落点只报 WARN，后处理文本进打印清单后处理栏。"
      src: "同上 §3.1『可拆后清理即可』；N03 背孔见 I2_N03_print_orientation.md 附录第 3 条"
      post_process:
        screw_hole: "拆支撑后 Ø2.4 钻头通孔（M2 螺丝 Ø2.0 对 Ø2.4 过孔，钻头只清疤不扩孔）"
        pilot_hole: "拆支撑后用该特征 nominal_d_mm 的钻头通孔（自攻牙料靠孔壁，不许扩大）"
        horn_hole: "拆支撑后 Ø2.4 钻头通孔（舵盘 6 孔）"
        counterbore: "拆支撑后 Ø4.4 沉孔底面用平头刀/砂纸清平，螺丝头要整圈坐实"
        tool_channel: "起子通道：清干净到名义直径（N02-F05 Ø15.05 对 Ø13.5 起子头，单边只余 0.775）"
        bore: "拆支撑后按名义直径清孔（无配合面的让刀孔不必处理；导向孔见 per_feature_overrides）"
        slide_corridor: "舵机口袋非配合面 / 走廊：拆掉里面的支撑即可；配合面壳层已单独按 forbid 判"
  per_feature_overrides:
    N03-F07:
      tier: removable
      post_process: "装前 Ø2.4 钻头通四个背孔（buildplate_only 下支撑柱仍从背孔穿到床面，是真几何不是声明伪影）"
