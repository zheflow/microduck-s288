# ── 2026-09-09 新增：承力路径（C3_L03_stiffness.what_would_unblock 第 1 条要的那份机器可读声明）──
# 为什么必须有它：第 7 层原来的 min_section 量的是"沿**世界 z** 每 1 mm 切一刀、**整件**最小的那一层
# 水平截面积"，那不是承力截面 —— H03 量到的 7.611 mm² 是下头壳最上沿的一圈装饰唇边（一克载荷都不过），
# L06 鞋底的 256.897 mm² 反倒是整件最大的实心块；而且只沿重力方向切，L04 踝副轴颈那种层间剪切
# 根本不在这个方向上。见 tolerances.yaml:load.min_section_and_rib.min_load_section_mm2.refused_2026-09-09。
#
# 本节把"力从哪进、从哪出、沿什么方向"写成数据，第 7 层（l7_mass.py:_sections）改成
# **沿声明方向的法平面、只在 from→to 那一段里**切，取那一段的最小截面。没声明路径的件判 unknown（红）。
#
# 坐标系：一律 export_local（= 该件导出 STL 自己的坐标系 = 它所属的 MJCF 连杆坐标系）。
#   定义与每个件的 world→export_local 变换见 features.yaml:frames（同一套，不另立）。
#   选它而不是世界系的原因有二：① 导出 STL 本来就在这个系里，不用再乘一次变换；
#   ② 它随连杆走，所以左右镜像件、零位/home 不同姿态下这条路径都是同一条 —— 旧写法只切了
#   镜像对里的一个实例、且只在零位姿，换个姿态结论就变。
#
# from/to 的取法（只用已经存在的声明，不新造坐标）：
#   · 关节轴点 = MJCF 连杆树里父/子 body 的原点。父关节 = export_local 原点 (0,0,0)；
#     子关节 = inv(TW(本 body))·TW(子 body) 的平移列，本轮用 duckstructure.kin 算出后逐条写进本文件。
#   · 从动盘 / 轴承座 / 凸台 = features.yaml 里对应特征的 geom.pos。
#   · 落地面 / 贴合面 = 该件导出 STL 包围盒在受力方向上的端面（features.yaml:frames.per_part[*].export_stl_bbox_mm）。
# direction 是**单位向量**，和 (to − from) 未必同向（例如落地件按重力方向切，而 from/to 还差一个轴向偏置）；
#   层里会把两者的夹角一并报出来，对不上会看得见。
