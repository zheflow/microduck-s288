# 没有声明承力路径的件：**逐条写明为什么写不出来**，而不是让它在层里变成一句无名的 unknown。
# 层（l7_mass.py:_sections）会把这里的 reason 原样贴进红格的 detail —— 写不出路径本身就是缺口，判红。
parts_without_declared_load_path:
  - part: "T01"
    reason: "T01 是浮动基座（MJCF root body trunk_base），有三个子关节（左右髋偏航 + 颈俯仰），载荷是三条支路 + 电池/主板/整机自重的**分布**载荷，不能约化成一条 from→to。要写它得先声明『按哪条支路、什么工况』——例如『单脚站立时右髋偏航支路』——那是三条独立路径，本轮不编。"
    what_would_unblock: "把 static_stand 拆成 double_support / single_support_L / single_support_R 三个工况，逐工况给 T01 一条支路路径（from=受载那侧髋偏航轴，to=另一侧髋偏航轴或颈俯仰轴）。"
  - part: "T02"
    reason: "躯干侧壳，只由 4×M2×8（F20_shell_to_T01）挂在 T01 的柱上，不在任何一条传力链上（它承的是自重与外壳磕碰，后者是冲击工况，README 第 2 节把冲击划给 bench）。"
    what_would_unblock: "bench.yaml 增加跌落/磕碰工况并给出等效静载，才谈得上截面判据。"
  - part: "T03"
    reason: "同 T02（镜像件）。"
    what_would_unblock: "同 T02。"
  - part: "B01"
    reason: "电池仓门，靠 F21_B01_to_T01_front 一颗 M2×6 + F28_snap_B01 两颗卡珠固定；它托的是电池自重，方向随整机姿态变，而且卡珠是点接触、力的入口位置由 R13 的过盈量决定，data 里没有卡珠承载的声明。"
    what_would_unblock: "relations.yaml:R13 给出卡珠的承载方向与允许载荷（或改用绑带固定并声明绑带位置）。"
  - part: "H01"
    reason: "H01 同时是头横滚舵机笼、N03 A/B 盘的半座（R12 铰链）、香橙派立柱载体、以及 H03 的接口（F22 4×M2×8 自攻）—— 四个载荷入口分布在件的四个不同区域，没有一条主路径。**注意 H01 上的香橙派立柱是冻结项**，不能为了凑一条路径去改它。"
    what_would_unblock: "把它拆成多条路径逐条声明（A/B 盘 → 头横滚轴、立柱 → 主板自重、4 脚 → H03），每条都要有自己的工况；本轮只写能从现有数据一次推出来的那些。"
  - part: "H03"
    reason: "下头壳，H01 4 脚自攻挂上去；它托的是自己的壳体自重与（将来的）脸屏，脸屏尚未选型（V2_S288版发布产物/01_整鸭打印件/打印清单与参数.md：『屏板替换件与相邻零件接口尚未复核』）。入口位置和大小都还不存在。"
    what_would_unblock: "脸屏选型 + components.yaml 给出它的 mass_g 与安装点，才有 from。"
