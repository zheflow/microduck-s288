# 本文件由 docs/gate/inventory_v2.json + inventory_original.json + comparison_original_vs_v2.md 机械转换而来。
# 字段约定见 tools/gate/data/README.md：
#   · 每条记录必须有 provenance（duck.py:行 / s288.py:行 / ankle_split.py:行 / mechanical_audit.json:键 /
#     inventory_original.json:路径 / inventory_v2.json:路径 / MJCF:行 / comparison_original_vs_v2.md:编号）
#   · 数值字段统一写成 {v: <值>, src: measured|datasheet|assumed}
#   · 搬不过来的值写 v: null，并在同条记录里给 unknown_class + unknown_reason
# 单位：mm / mm^3 / g / N / degC，除非字段名另有后缀。不四舍五入。
# relations.yaml —— 22 条功能关系 + comparison C1/C2/C3 三条 Gate 条目。
# declared_target 是原始表述（可能是一句话），真正的判据范围一律去 target_ref 指的 tolerances.yaml 桶里取。
# status=open 表示该关系目前没有满足的证据，第 5/7 层判 BLOCK。
# 2026-09-09 新增 contact 段（第 5 层 l5_function.py:contact_profile / _resolve_party 直接读的机器可读结构）：
#   contact.approach 必须是带符号的轴（'+x'/'-z'…），层里 _axis_vec 对裸 '+' 会解析成 None；
#   contact.parties[0] 是**沿 approach 压过去的那一方**，parties[1] 是被压的一方（顺序换了符号不变，但语义会反）；
#   contact.probe_bbox_mm 是 [[x0,y0,z0],[x1,y1,z1]] 的**世界坐标**窗口 —— 本文件里唯一的世界坐标例外，
#     每个窗都在 probe_bbox_rationale 里写清是怎么从 cad/duck_s288/placed/ 量出来的、为什么这么夹；
#   contact_profile 的符号约定是**过盈为正、间隙为负**。tolerances.yaml 里多数桶的 target_range_mm 写的是
#     间隙的绝对值（正数），两者口径不符的，本文件在 contact.convention_conflict 里逐条点名，
#     该改的是公差表的口径不是几何 —— 本轮按分工不动 tolerances.yaml。
#   量不出来 / 量出来也不是那个量的，一律 contact: null + contact_unknown_class/contact_unknown_reason，
#     宁可留红也不硬凑一个窗（凑了会同时造一条无意义的红和一格 fit_measured_geometry 的假绿）。

# ── 2026-09-09 新增：kind 词表与它的语义（第 5 层拿 kind 决定"要不要有接触面积"）────────────
# 起因：R15/R16 的 kind 被标成 clamp，而它们自己的 note 写着"非夹持"和"过载止挡"。
# l5_function.py:746 的 need_touch 是一份**白名单**：kind 落在 (clamp, press_fit, bearing_seat,
# driven_disc, snap) 里才要求"接触面积 > 0"，不在名单里的按"不要求接触"处理。所以把 R15/R16 改成
# 下面两个新 kind 之后，层不用改一行，判据就从"必须夹住"变回"必须留够间隙"（有符号配合量仍照判）。
# **新增 kind 时必须先想清楚它该不该进那份白名单**，并在这里登记；漏登记 = 默认不要求接触。
kind_semantics:
  requires_contact_area:
    _who_reads_it: "tools/gate/layers/l5_function.py:746 need_touch"
    kinds: ["clamp", "press_fit", "bearing_seat", "driven_disc", "snap"]
    why: "这几类的功能就是'压住/夹住/顶住'，接触面积 = 0 等于功能为零（历史事故：H02 压板按 0.30 均匀间隙建模，交集恒为 0，'夹持'什么也没夹住）。"
  no_contact_by_design:
    kinds: ["clearance", "overload_stop", "slide_fit", "hinge", "screw", "horn_coupling",
            "stiffness", "cantilever_load", "sensor_extrinsic"]
    why: "这几类**按设计就不接触**或不是面接触。对它们要求接触面积会造出假红；反过来，如果哪天量到接触了，那才是异常 —— 但那要另立判据（例如 overload_stop 的'正常工况下必须不接触'），本轮没有。"
    clearance: "两件之间声明的让位间隙（不传力）。判据 = 有符号配合量落在声明区间内（过盈为正 / 间隙为负）。"
    overload_stop: "过载止挡：正常工况**不接触**，只在过载时才顶上，用来限制行程/保护舵机。判据同 clearance；'过载时顶得住'属于强度题，归第 7 层，需要 tolerances.yaml:load 里的许用应力（现在是 null）。"
  open_gap_2026-09-09: "现在的层是**白名单**语义：一个拼错的 kind（例如 'clanp'）会静默落进'不要求接触'。真要严，l5 应当对不在本词表里的 kind 判 unknown。那是第 5 层的改动，本轮按分工不动 l5_function.py，把缺口写在这里。"

