pre_assembly_2026-09-15:
  id: pre_tap_servo_holes
  action: 所有 S288 的法兰 6 孔（Ø1.7 光孔，手册"深 3.0 MAX 用 M2 自攻"）与背面 4 角孔（Ø1.7）在装任何件之前，先用装机同款 M2 自攻螺丝**空拧到底再退出**，把牙切好；或用 M2 丝锥攻到 3.0。
  why: 2026-09-15 测试台实物：TB02 摆臂 6 孔对位正确（分度圆 Ø10.5 定案），但 M2×10 露出只 2.5 mm（7.0 承压层 + 0.5 垫圈），自攻锥形导入段占 ~1 mm，剩 1.5 mm 切不动光孔 → "吃不上劲"拧不进。整鸭法兰组同样：F02 露出 2.0、F04/F06/F08 2.5，全是自攻进光孔；预先开牙后短露出也能咬住。
  applies_to:
  - F02_hipyaw_flange
  - F04_hiproll_flange
  - F06_hippitch_flange
  - F08_knee_flange
  - F10
  - F11
  - F13
  - F14
  - F17
  - F19
  - F21
  - F03_hiproll_back
  - F01_hipyaw_back
  - F05_hippitch_back
  - F09
  - F15
  - F18
  - F22
  note: 空拧时舵机不通电、手拧，感觉到底就停（塑料盲孔顶死会滑牙）；每个孔只开一次牙，反复拆装次数见 S288 全塑料约束。
  tool: PH0 + M2 自攻（或 M2 丝锥）
  gate_note: 不是装配步（无零件运动），第 4 层不判；只作装配前置说明。
