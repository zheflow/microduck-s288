discrepancies:
  - id: "D-COMP-01"
    what: "'6704ZZ' / '6700ZZ' 这两个型号名在两份 inventory 里指的**不是同一颗轴承**"
    a: "inventory_original.json:components[14] 写 \"'Seeed bearing' 22×16×4（内 16 / 外 22 / 厚 4；**对应标准 6704ZZ**）\"；components[15] 写 \"Ø15×10×3（**对应 6700ZZ**）\""
    b: "inventory_v2.json:purchased[1] 写 \"6704ZZ **20×27×4**\"（座 Ø27.15 / 毂 Ø19.85）；purchased[2] 写 \"6700ZZ **10×15×4**\"（座 Ø15.1 / 轴 Ø9.95，轴向 x -21.4..-17.4 = 4.0 厚）"
    why_it_matters: "① 标准 6704ZZ 就是 20×27×4，原版那颗 16×22×4 **不是 6704**，原版清单的型号映射是错的；② 因此 comparison A2 说的'只留 6704×4 + 6700×2'听起来像沿用原版，实际上我们的髋横滚/膝轴承比原版**大了一圈**（外径 22→27、内径 16→20；09-17 起髋横滚 6704 已取消、只剩膝，取消原因之一正是这一圈：OD 27 在真实姿态里左右互撞，见 docs/reports/髋横滚轴承取消_2026-09-17.md），座孔壁厚与件的截面都不能拿原版的经验类比；③ 我们的 6700 是 4 mm 厚，原版那颗是 3 mm —— 轴向堆叠差 1 mm"
    resolution: "以 inventory_v2 的尺寸为准（那是我们真要买的件）；原版侧一律按 16×22×4 / 15×10×3 的**实际尺寸**引用，别用型号名。2026-09-12 起我们也真的用了一颗 16×22×4（头横滚 B 端，bearing_22x16x4）和两颗 6702ZZ 15×21×4（髋偏航，与原版那颗也不是同一颗）"
    provenance:
      - "inventory_original.json:components[14]"
      - "inventory_original.json:components[15]"
      - "inventory_v2.json:purchased[1]"
      - "inventory_v2.json:purchased[2]"
      - "comparison_original_vs_v2.md:A2"
  - id: "D-COMP-02"
    what: "主控板脚印：65×30 还是 65×32"
    a: "inventory_original.json:components[8] —— dummy 65×30×1.6，且注明 Radxa Zero 3W 官方 65×30（与 Pi Zero 同）"
    b: "inventory_v2.json:assumed_values[12] / duck.py:33 —— P['brd'] = (65, 32)"
    why_it_matters: "H01 前立板与立柱是按 65×32 让的空间，比实际板宽 2 mm；孔距 (58,23) 两边一致，所以只影响包络不影响孔位"
    resolution: "到货量 Orange Pi Zero 3W 实物再定；在那之前 65×32 记 assumed"
    resolved_2026-09-17: "主控换回 Radxa ZERO 3W（官网 65×30），a 侧正确；P['brd']=(65,32) 只是让空间的包络、偏保守 2 mm，孔距 (58,23) 正确 → H01 立柱不动。差异结案，包络值下次改 head.py 时顺手改 65×30。"
    provenance:
      - "inventory_original.json:components[8]"
      - "duck.py:33"
      - "inventory_v2.json:assumed_values[12]"
  - id: "D-COMP-03"
    what: "摄像头视锥禁入体绑的出瞳点，和 MJCF head_camera site 不是同一个点"
    a: "inventory_original.json:sites[3] head_camera 世界 (81.4, −0.09, 251.11)，光轴 = site +x；comparison A12 说'光轴以 site 为准'"
    b: "inventory_v2.json:keepouts[14] —— 视锥 80°×60° @ (89, 0, 264)，且注明'绑定该出瞳'"
    why_it_matters: "两点差 (+7.6, +0.09, +12.9) mm，FOV 也从原版推断的 ≈62° HFOV 变成 80°×60°。如果最终相机要坐在 MJCF site 上（策略/kinematics 的 HeadFk 用的就是 site），现在这个视锥禁入体的锚点高了 13 mm"
    resolution: "选型时二选一：要么把相机放到 site 上并重算视锥，要么显式声明新的相机外参并同步 kinematics —— 见 frozen.yaml:C6_interface_budgets"
    provenance:
