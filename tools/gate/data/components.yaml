  - id: "sbc_radxa_zero3w"
    category: "board"
    model: "Radxa ZERO 3W 2 GB 带 40 针排针版（用户 2026-09-17 拍板换回原版主控；**2026-09-22 已在瑞莎店下单**）"
    i2c3_overlay_2026-09-30: "主控板会话查到的根因：40 针 3 / 5（I²C3_M0）之前起不来 —— Radxa 官方 rk3568-i2s3-m0 overlay 里带一段把 i2c3 置 disabled，且按文件名排序它排在 rk3568-i2c3-m0 之后。板上已修：i2c3 overlay 复制成 /boot/dtbo/zz-i2c3-m0.dtbo（原文件改名 .disabled）让它最后应用，重启后 i2c-3 / i2s3 / npu 三者都 okay → 线束口径（I²C3 3 / 5 与 I²S3 12 / 35 / 38 / 40 同时用）成立"
    heatsink_candidate_2026-09-30: "用户准备买 Radxa 官方 Heatsink 5519A（纯铜 55×19×2 + 55×19×1.5 导热硅胶片，整面贴芯片面，缺口让排针 / 天线）；**未买未到，到货以实物为准，envelope 不改**。主控板会话估：芯片面包络 3.0 → 3.5；铜片按尺寸 × 铜密度约 19 g（55×19×2 × 8.96 = 18.7，缺口未扣；导热垫质量未计），比裸板还重（该会话口径裸板 15.4 g；本条 mass_g 是 09-23 称的 14.93 g 带排针、不含 TF，口径不同未改），头部质量要加。形体预检（hr53_work/a03_sbc_heatsink_probe.py / .json，只读，现役 placed + 头内线束实体，0.5 格，抽样误差 ≈0.1）：芯片面中部（x −11.6..4 × y −28..26）头顶 ≥ 3.9 → 叠高 3.5 余 ≥ 0.4；紧的在外圈 —— 孔旁 H05 吊柱外沿离板面 ≈3.4（离孔心 3 mm 处）、排针旁杜邦壳 3.0（x > 4）、板两头 / −x 口边 H05 壳低到 ≈0.6–0.7。整片放不放得下取决于散热片孔位缺口与两头 / 口边外形 → 到货或拿到官方尺寸图后逐点核；芯片面上方没有 H01"
    decision_2026-09-17: "从 Orange Pi Zero 3W 换成 Radxa ZERO 3W。理由（本仓核实）：① 65×30、孔距 58×23 = 树莓派 Zero 脚印 = H01 现有 4 根 Ø5 立柱（冻结）**不用动**；② 原版 Microduck 头就是给这块板设计的：原版 placed 里 pcb 在 x 67.3..68.9、HAT 在 x 59.2..60.0（板后 7.3 = 40 针排针层），我们 H01 保留的 14 mm 口袋（前立板 x52 → 板 x66）正是给排针留的；③ RK3566 4×A55 ≤1.6 GHz 被动散热即可（香橙派 A733 要 65×32×11.8 风扇组件，头里任何朝向都放不下：前 11.2 且被镜头座占中、后 14 且排针无处放）；④ 40 针有 I²S（麦克风/功放模块直插），双 USB-C（USB3 主机口给宇树转接板、USB2 OTG 口供电）；⑤ 官方 Microduck 软件栈/RKNN 视觉在它上面现成。代价：≈¥309 vs ¥50+51，算力 0.8 TOPS vs 3 TOPS（走路用不到）。"
    qty: 1
    claim:   # hr37
      by: "placed_prefix"
      pattern: "zz_sbc"
    envelope_solid: {shape: none, why: "hr43e：层只认单盒（OBB 中心落位）。Radxa 平放叠层 = 板底元件 / CSI 座（3.0）+ 板 1.6 + 顶面元件（3.0）/ 40 针塑座+针（8.7，只在 x 6.16..11.24 一条）+ TF / 边口外伸 → OBB 13.3×31.2×67.0 的中心 z 259.35 比板中面 256.5 高 2.85；1.6 板盒放在那里 = 悬在板上方的一整片 65×30 → × H05 顶内皮 133.79 mm³（hr43d 记分卡；hr43e 抽样 123.6，交区 z 258.9..259.9，顶壳内皮按真元件让位、板边外圈比这片低）；真元件 placed zz_sbc × 打印件 = 0（L3 part_vs_component_solid 0.000；hr43e 抽样 0）→ 登记口径问题；hr43 起就红（141.08 → hr43c / hr43d 133.79），不是 hr43d 引入。另：同一口径让 placed_covers_envelope 也红（OBB 13.3×31.2×67.0 vs 声明 1.6×30×65）。多盒见 envelope_boxes_2026-09-25_hr43e；层支持多盒前按 none"}
