    model: "航模外置 UBEC 5V/3A —— **2026-09-22 定型：科亿航模 UBEC-3A（店铺 KEYIUAV）**，成品热缩包。旧 09-20 口径（输入裸线 → WAGO）作废：WAGO 两个侧腔都塞不下。"
    connectors_2026-09-22: "**两端都已向卖家问实（客服 ky技术 聊天记录）：**\n  输入端 = 卖家代焊，下单拍『XT60 焊接插头』选项 + 备注『输入焊接 XT30 母头（XT30U-F，带洞）』。客服原话『公母头外观很清晰的，你确定好来是焊公，还是母，备注清楚就行』→ 公母由我们定。\n  客服起初答『公头』是按通用规矩（母头=送电端、公头=取电端，他假设插电池）；**不适用**：我们插的是宇树转接板 XT30 扩展口，实物照片确认是公针，针对针插不上 → 必须母头。见 harness.yaml:HB02.connector_gender_2026-09-22。\n  输出端 = **JR 杜邦插头，间距 2.54 mm**（客服原话），即 3 位舵机插头（商品图实物是**黑色**外壳，不是常见白色；3 位里只用 2 位——红=+5V、黑=GND，第三位空），出厂自带、不是选项、无需代焊。输入端在商品图里是**两根裸线**（红/黑，端头搪锡），卖家就是在这两根上焊 XT30。插头公母到货看一眼：标准是母头（3 个洞）→ 用购物车『公对母 40CM』；万一是公针 → 改用购物车『母对母 40CM』，两根都已在车里，不用补买。\n  **输出端定案（2026-09-22，客服主动提出）：由 JR 3P 改为 1P 插头 —— 正负各一个独立 1P 母头（套 2.54 排针），并请卖家把输出线做到 ≈10 cm。**客服原话：『你的被供电的配件，正负极是否也是并联的呢？还是分开不同位置的，如果是分开不同位置的话，降压模块的输出端也要改一下哦／改成 1P 插头方式的』。\n  理由：目标是 Radxa 40 针的 pin4(5V) 与 pin6(GND)，同排相邻（2.54），2P/3P 插得上但**无防呆**——插反即红线落 GND 针、黑线落 5V 针，5V 对地直接短路、板子报废；1P 两根各自独立按针插，物理上不存在插反。副作用：省掉原方案的杜邦 公对母 40 cm 转接（该线留作备用，不退）。\n  线长 10 cm 的依据：转接板（H03 口袋）、UBEC（H01 前立板背面，hr38）、Radxa（H01 立柱）三者同在头内，间距都在几十毫米量级；原配长线无处盘绕（hr38 的 zz_dupont_slack 余量盒按 ≈10 cm 建）。\n  **若卖家最终只能给 JR 3P**：退回杜邦转接方案，且**禁止**把 JR 插头直接怼到排针上（三位正好落在 pin2/4/6，插反即短路）。"
