        note_bearing_roll: "`bearing_roll` 物理上是本组的第 10 个（右髋横滚载体，yaw2roll 的镜像），但训练配置把它列进了 HEAD_BODY_NAMES —— 见 head_group.caveat_2026-09-09。这里按训练配置放在 head_group，不重复列。"
        mass_rel: {v: 0.0, src: "datasheet", src_note: "训练里腿部 body 既没有质量随机化也没有质心随机化"}
        com_mm: {v: 0.0, src: "datasheet", src_note: "同上 —— 腿部质心漂移在训练里是完全没见过的方向"}
        note: "严格按训练范围，腿部的容差是 0/0。层用的全局 0.286 g / 3.0 mm 对腿部**已经是放宽**，判红是下限结论。"
