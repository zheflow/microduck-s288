      vs_current_scalar: "本文件在用的 1.27 比 TDS 高 2.4%。1.27 的出处只有『打印清单假设值』，没有 TDS 支撑 —— 也就是说现在 16 个 PLA 件的质量是**偏重**的（保守方向：静扭矩/漂移都往坏里算）。差值：专用件 PLA 合计 270.2 g → 按 1.24 算 263.8 g，−6.4 g。"
