      expected_shape_when_filled: "≥6 条 {speed_rad_s, torque_Nm, bus_current_A, bus_voltage_V, case_temp_C, n_repeats, spread} 记录，另加测试条件（母线电压、驱动器设置、样品编号 ×2）。"
