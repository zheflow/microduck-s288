        mass_rel: {v: 0.0, src: "datasheet", src_note: "**训练里这几个 body 一个质量随机化都没有** —— dr.pseudo_inertia 只挂 trunk_base"}
        com_mm: {v: 3.0, src: "datasheet", src_note: "randomize_head_com（cfg:424-434）"}
        com_mm_if_curriculum_completed: 10.0
