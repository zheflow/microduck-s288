  blind_depth_by_joint_type:
    s288_plastic_self_tap: "tolerances.yaml:engagement_by_joint_type.s288_plastic_self_tap.hard_cap_mm"   # 2026-09-10：128 颗实际走的是这一条
    s288_metal_thread: "tolerances.yaml:engagement_by_joint_type.s288_metal_thread.hard_cap_mm"           # v2_usage: 0，只剩反例在用
    pla_self_tap: "由该孔自己的 features.yaml:<id>.geom.depth_mm（自攻底孔的盲深）给，不是常数"
    heat_set_insert: "tolerances.yaml:engagement_by_joint_type.heat_set_insert"   # v2 一颗没用
  per_hole_not_per_group: true
  why: "F11b（N01 颈俯仰下排）就是被'按组取 max 叠厚'掩盖的：组内 max 5.2 选 M2×8，实际下排只有 3.3"
  provenance:
    - "tools/gate/README.md 第 2 节 第 5 层"
    - "inventory_v2.json:unknowns[1]"
# ── 2026-09-10 新增：打印工艺偏移（本仓库第一个**实测**公差锚点）─────────────────
# 在此之前 tolerances.yaml 的 26 个配合桶**没有一个**有真实打印件数据，全是名义值/采用值。
# 本节不改任何几何：用户 2026-09-10 已决定 **不改 CAD**，改成让打印店在切片里做孔径补偿
# （Bambu/Orca `hole_size_compensation` / Cura `X-Y hole compensation` / PrusaSlicer `Hole Horizontal Expansion`）。
# 所以本节的用途只有一个：**判「哪些配合在不补偿的情况下会失效」**，即给出一张
# 「这批件如果照现在的 STL 直接打、切片不补偿，会装不上的清单」。它不是设计输入。
process:
  _positioning: "本节是**判据输入**，不是**设计输入**。不许有任何工具拿 xy_offset_mm_per_side 去**自动**改 CAD 尺寸。**口径变更 2026-09-13**：用户拍板『有则改之』——M2 过孔/头窝这两个**内轮廓**按本节实测让 0.15/边（2.2→2.4、4.2→4.4，手改常量、有出处），不再把命押在切片补偿上（PrusaSlicer 只有整体 XY 补偿，会连带缩小没测过的外轮廓）；外轮廓（毂/轴颈/榫）仍按原值，等 TC01b 毂规读数。09-10 那句『走切片补偿、几何保持现状』到此为止。本节存在的意义是：在补偿没被执行（或执行了但没验证）的情况下，把会失效的配合点名点出来。"
  _layer_reads_this: false
  _layer_reads_this_note: "**层现在一个字节都没读本节。** `grep -rn xy_offset tools/gate/layers/` 为空（2026-09-10 核对）。所以本节现在是数据，不是判据 —— 和 load.density_by_material 的处境一样。不许因为本节存在就说『打印偏移已经被 Gate 覆盖了』。要变成判据需要改层（见 what_would_make_it_a_criterion），改层不在本轮范围。"
  xy_offset_mm_per_side:
    v: 0.15
    src: "measured"
    出处: "TC02 孔规 2026-09-10"
    src_note: "TC02_holes 孔规（tools/cad/coupons.py:holes()，11 个竖直孔 Ø1.6→2.6 步进 0.1，平放打印）。用户 2026-09-10 拿 M2 螺丝逐孔试：**从右数第 4 个孔恰好能插进 M2，再往小的都进不去**。孔规从切角那头 Ø1.6 递增到 Ø2.6，右端是 2.6 → 从右数第 4 个 = 2.6 − 3×0.1 = **Ø2.3**。设计 Ø2.3 的孔实测刚好等于 M2 外径 → 直径缩水 2.3 − 2.0 = **0.30 mm**，单边 **0.15 mm**。"
    measurement_chain: "设计孔径 2.30 − 实际通过孔径 2.00 = 0.30 直径 ⇒ 0.15/边。**注意这一步用了一个未验证的等号**：把『M2 螺丝的实际外径』当成了 2.00。"
    reading_2026-09-16:
      raw: "用户 2026-09-16 口述（同一片 TC02_holes 孔规，**现在买的这批 M2 螺丝**）：能『无阻碍』进去的是**第二大的孔（Ø2.5）**；到**第三大（Ø2.4）**就不能无阻碍进了。"
      derived: "自由通过阈值落在 Ø2.4–2.5 之间（比 09-10 那次『Ø2.3 恰好能插进』的判据松一档：无阻碍 ≠ 恰好）。若螺丝外径仍按 2.00：缩水 0.4–0.5 直径 = **0.20–0.25/边**，高于本节 v=0.15、也高于 band 上界 0.20。"
      open_questions: "① 09-10 与 09-16 是不是同一批螺丝（用户说『现在买的』，可能换了）；② 『无阻碍』是手推还是拧；③ 这颗螺丝的实际外径没量过（卡尺一量就能把 ±0.03 那项去掉）。三个都没答之前 v 不改，本条只记数据。"
      user_decision_2026-09-16: "过孔**不改**（保持 2.4，装配时多拧几圈）；材料改 **PETG**（本节 PLA 读数到此为止，PETG 试件包重打后另立读数）；自攻底孔打完钻 Ø1.6。TC04_horn_24 已实物拧上舵机法兰、6 颗全对孔（分度圆 r 5.25 落实）。"
      user_followup_2026-09-16: "用户随后说：螺纹大径就是 2.0（口述，未说是否卡尺量）；过孔紧一点『多拧一拧』就行、材料 PLA/PETG 都可。→ 按 2.0 算缩水 0.20–0.25/边成立。过孔紧的后果小（多点扭矩、夹紧力略降），底孔的后果不小（Ø1.6/1.7 打成 1.1–1.3，M2 小径 ≈1.5 都塞不进，见 fits.pla.self_tap_pilot 的 why_no_verdict）。"
      implication_if_confirmed: "M2 过孔现值 Ø2.4（s288.py horn_hole_d / mnt_hole_d，09-13 由 2.2 改来）对这批螺丝是**有阻碍**的过孔 → 要改 Ø2.5；头窝 4.4 / 垫管孔 4.4 同理各 +0.1；自攻底孔 Ø1.6/1.7 名义不变但实际径向过盈比 fasteners.yaml 按 0.15 算的更大（更难拧、更易裂）。改不改由用户定，改的话是常量级改动、需重 build + L5 重跑。"
    uncertainty:
      from_gauge_step_mm: 0.05
      from_gauge_step_note: "孔规步进 0.1 mm（直径），Go/No-Go 只能把真值框在相邻两孔之间 → 直径 ±0.10，单边 ±0.05。"
      from_screw_od_mm: 0.03
      from_screw_od_note: "M2 外螺纹大径按 ISO 965 是 1.886~2.000（6g），**用户没有拿卡尺量这颗螺丝**。若实际是 1.94，则真实缩水 = 2.30 − 1.94 = 0.36 直径 = 0.18/边。所以 0.15 是这个区间的**下界**，不是中值。"
      band_mm_per_side: "0.15 ~ 0.20（保守取用时按上界 0.20 复核一遍，见 conservative_use）"
      conservative_use: "元规则 4（宁可多报红）：判『会不会失效』时用 0.15 已经能判红的，用 0.20 只会更红；反过来，靠 0.15 刚好判绿的配合**不算通过**，因为 0.20 会让它翻红 → 那类要标 marginal，不许当绿。"
    scope:
      applies_to: "**内轮廓（孔/槽/内腔）**，竖直孔（孔轴 ⊥ 打印床），PLA，0.4 喷嘴 / 0.2 层高，用户这一台打印机、这一卷料。"
      does_not_apply_to_outer_contours: "**外轮廓（轴 / 凸台 / 毂 / 榫）方向相反，且本仓库没测。** 同一个挤出偏移让孔变小、让轴变大，所以不许把 0.15 直接搬去判 fits.pla.bearing_inner_hub_6704（毂 Ø19.85）、fits.pla.journal_slide_6700（轴颈 Ø9.95）、L05 榫。TC01b_hubs 毂规的 STL 在 cad/coupons_s288/ 里出好了，但**它有没有被打印、有没有读数，本仓库一个字都没记**（placeholder_summary.coupons_printed 至今是 0）→ 外轮廓偏移仍是 unknown。"
      outer_contour_offset_mm_per_side:
        v: null
        src: null
        unknown_class: "not_measured"
        unknown_reason: "TC01b_hubs（Ø19.7/19.85/20.0 三根毂柱）与 TC01_bearing（Ø27.0/27.15/27.3/27.45 四个座孔）的 STL 已生成（cad/coupons_s288/），**但本仓库没有任何记录说它们被打印过**，更没有读数 —— 2026-09-10 用户报的只有 TC02 孔规这一项。没有读数就没有外轮廓的锚点。不许拿孔的 0.15 反号当外轮廓用 —— 挤出偏移对内外轮廓的量值不一定相等（内轮廓还叠了一层小圆孔的弦高效应）。"
      does_not_apply_to_horizontal_holes: "TC02b_hholes（站着打、孔轴水平，Ø2.0/2.2/2.4/2.6）是**另一条独立的锚点**，同样没有读数（是否打印过本仓库也没记录）。coupons.py 的注释明说『横孔打出来比竖孔更小』→ 横孔偏移 ≥ 0.15，具体多少 unknown。侧壁上的过孔（例如 T01 IMU 前壁孔）属于这一类。"
      horizontal_hole_offset_mm_per_side:
        v: null
        src: null
        unknown_class: "not_measured"
        unknown_reason: "TC02b_hholes 的 STL 已生成，**是否打印过本仓库没有记录**，用户也未报任何读数。横孔与竖孔是两条独立的锚点，不许用竖孔的 0.15 代。"
    consistency_with_earlier_estimate: "docs/gate/实测公差锚点_2026-09-09.md 第 2 节从测试台 TB01 卡槽（设计单边过盈 0.05 → 实物『装上就拆不下来』）**反推**出 0.15~0.30/边。本次 TC02 是直接量的，落在那个区间的下端 —— 两个独立来源不矛盾。但两者证据强度不同：TB01 是从『装配手感』反推的量级，TC02 是孔规读数。"
    coupon_name_collision_warning: "**本仓库有两个东西都叫 TC02。** ① tools/cad/coupons.py:holes() 产出的 `TC02_holes.stl` = M2 竖直孔规（**这次打的、这次量的就是它**）；② tolerances.yaml:deliberately_added.tolerance_coupons_TC01_TC05.coupons[TC02] 写的是『榫/槽 0.2 间隙 + Ø1.6 底孔自攻咬入』，对应 fits.pla.key_slot。两者不是同一个件：TC02_holes 上没有任何榫/槽特征。所以 **fits.pla.key_slot 并没有因为这次打件而拿到锚点**，它的 coupon 仍是『未打』。placeholder_summary.coupons_printed 本轮**故意没动**（它数的是 ② 那张表，动它会说成『榫槽锚点有了』）。"
  criteria:
    _note: "两条可被判据引用的准则。写成 expr 是为了将来层能直接读；**现在没有任何层读它们**（见 _layer_reads_this）。每条都注明了它对『间隙』的口径要求 —— fits 表里既有直径量也有单边量，混用会差 2 倍，所以口径判不出来的桶一律 unknown，不猜（元规则 3/4）。"
    PX01_clearance_survives_offset:
      name: "设计间隙 − 2×offset > 0"
      expr_diametral: "design_clearance_diametral_mm - 2 * process.xy_offset_mm_per_side.v > 0"
      expr_per_side: "design_clearance_per_side_mm - process.xy_offset_mm_per_side.v > 0"
      which_expr_to_use: "看该 fits 条目自己声明的量。声明了 `gate_must_use.quantity`（例如 plain_slide_head_roll 的 radial_clearance_per_side_mm）的用 per_side；`meaning` 里写明『单边』的用 per_side；只给一个直径差的用 diametral。**两者都判不出来的桶 → res.unknown，不许默认按其中一个算**。"
      failure_meaning: "结果 ≤ 0 表示：切片不做孔径补偿时，这个让位/滑配在实物上是**零间隙或过盈** → 装不进去，或装进去转不动。"
      marginal_meaning: "per_side 口径：结果 > 0 但 ≤ 0.05 → marginal。diametral 口径：结果 > 0 但 ≤ 0.10 → marginal。两个门槛差一倍是因为直径量吃两倍偏移；0.05 / 0.10 都等于『把 offset 从下界 0.15 换成上界 0.20 之后会翻红』的那段宽度（见 xy_offset_mm_per_side.uncertainty.band_mm_per_side）。marginal 不算绿。"
    PX02_through_hole_survives_offset:
      name: "设计Ø − 2×offset > 螺纹外径"
      expr: "design_hole_d_mm - 2 * process.xy_offset_mm_per_side.v > screw_major_d_mm"
      screw_major_d_mm:
        v: 2.0
        src: "datasheet"
        src_note: "M2 粗牙外螺纹公称大径 2.0（ISO 261）。**本仓库没有量过实际螺丝**，与 xy_offset 的 measurement_chain 用的是同一个假设 —— 两处一起错时会互相抵消一部分，判据文字里不许说『已按实测螺丝径验证』。"
      applies_to_feature_types: ["through_hole_m2"]
      does_not_apply_to: "**底孔（pilot_hole_m2）不适用** —— 自攻底孔本来就必须小于外径，这条准则套上去会把一个正确的设计判红。底孔受 offset 的影响要按『挤压量变大 → 拧入扭矩上升 / 胀裂风险』来判，那是另一条判据，本仓库没有。"
      failure_meaning: "expr 不成立时（即 design_hole_d_mm − 2×offset **≤** screw_major_d_mm）表示：切片不做孔径补偿时，M2 螺丝**穿不过这个过孔**。注意判失败的条件是这条不等式不成立，**不是『某个差值 ≤ 0』** —— 阈值是螺纹外径 2.0，不是 0。"
      marginal_meaning: "expr 成立但余量（design_hole_d_mm − 2×offset − screw_major_d_mm）≤ 0.10 → 标 marginal。0.10 = 2×(0.20−0.15)，即换用 offset 区间上界 0.20/边 后会翻红的宽度。"
  screened_2026-09-10:
    _what_this_is: "拿上面两条准则在**现有 fits 表的名义值**上手算一遍的结果。只收口径明确、算得出来的条目；口径不明的列在 unscreened 里。这是一张**清单**，不是判据 —— 没有任何层跑过它。"
    _screening_input_hash_note: "输入是 tolerances.yaml:fits 自身的 nominal_mm.v，不是导出 STL。想绑 STL 哈希得等层实现（元规则 6）。"
    screened_against_PX02:
      _note: "**键名是『按 PX02 筛过的条目』，不是『违反 PX02 的条目』** —— 每行自带 verdict，别按键名下结论。（2026-09-10 本键原名 violates_PX02，改名是因为同一节的 PX01 那张表里混着 过/marginal/unknown 三种结果，用 violates_* 当键名会让读的人把整张表当成红名单。）"
      rows:
        - key: "fits.pla.m2_through_hole"
          design_mm: 2.2
          effective_mm: 1.90
          threshold_mm: 2.0
          verdict: "FAIL —— 2.20 − 0.30 = 1.90 < 2.0。**不补偿的话 M2 穿不过我们的 Ø2.2 过孔。** 这一条命中的不是某个件：2026-09-10 从 L5 自己的判据明细里数，15 个件上共 **108 个 Ø2.2 螺丝孔**（gate.py --layers 5 记分卡里 seat_flatness 那条的 detail 逐件报的『N 个 Ø2.2 螺丝孔』求和）。Ø2.2 是 s288.py:22 的 mnt_hole_d / horn_hole_d，也是 fits.pla.m2_through_hole 的名义值。"
    screened_against_PX01:
      _note: "**同上：键名是『按 PX01 筛过的条目』。** 本表 3 行的实际结论分别是 FAIL（plain_slide_head_roll discA）/ 过 PX01 但掉出该桶目标区间（general_clearance）/ unknown（key_slot，榫的外轮廓偏移没测）。"
      rows:
        - key: "fits.pla.plain_slide_head_roll"
          quantity: "radial_clearance_per_side_mm（该条 gate_must_use 显式声明）"
          design_mm: 0.09
          effective_mm: -0.06
          verdict: "FAIL —— discA 单边 0.09 − 0.15 = −0.06 → 头横滚 N03 discA 与 H03 半座变成过盈，转不动。这条 Gate 本来就按『0.09 < 目标下限 0.20』判 BLOCK，本次把它从『偏紧』升级为『不补偿则确定抱死』。discB 0.29 − 0.15 = 0.14 > 0 但 < 0.20 目标下限 → marginal。"
        - key: "fits.pla.general_clearance"
          quantity: "单边（meaning：『s288.py clr：所有让位的通用间隙』；clr 是单边量已核实：duckstructure/s288.py:54 body_prism 的 docstring 原文『c=单边间隙』，且 s288.py:84 servo_envelope 里 c = S[\"clr\"] + extra 直接喂给它）"
          design_mm: 0.3
          effective_mm: 0.15
          verdict: "**过 PX01，但掉出该桶自己的目标区间。** 0.30 − 0.15 = 0.15 > 0 → PX01 成立，且 0.15 > 0.05 的 marginal 带，所以按 PX01 不算 marginal；但 0.15 低于该条自己的 target_range_mm.min = 0.2 → **按 fits 的目标区间判是红**。两条判据结论不同不是矛盾：PX01 问『装不装得进』，target_range 问『间隙够不够当滑动/让位用』。按 offset 上界 0.20 算只剩 0.10，两条都更差。这一条是 s288.py 的通用让位 clr，命中面最大。"
        - key: "fits.pla.key_slot"
          quantity: "单边（meaning：『榫/槽单边间隙』）"
          design_mm: 0.2
          effective_mm: 0.05
          verdict: "**unknown（而不是 FAIL）**。槽是内轮廓、榫是外轮廓，两个方向都在吃这 0.2：槽变小 0.15/边，榫变大**未知量**/边。只算槽这一半：0.20 − 0.15 = 0.05 → PX01 勉强成立但正好落在 marginal 带（≤0.05），且已低于该桶 target_range_mm.min = 0.15；把榫那一半算进来极可能变负。**但榫的偏移本仓库没测**（scope.outer_contour_offset_mm_per_side = null）→ 最终判据只能是 unknown。列在这里是因为它是最可能被这个偏移打掉的配合，不是因为已经判它红了。"
    affected_but_no_verdict:
      - key: "fits.pla.m2_counterbore"
        design_mm: 4.2
        effective_mm: 3.90
        why_no_verdict: "M2 盘头直径本身是采用值 3.8~4.0（tolerances.yaml:assumed_values[AV19]，src: assumed，出处只有『复审交接』一句）。头径取 3.8 → 3.90 装得下；取 4.0 → 装不下。**输入是区间不是数，所以结论是区间，不是判决。** 要定案得量一颗真螺丝的头径。"
      - key: "fits.pla.m2_pilot_hole_self_tap"
        design_mm: 1.6
        effective_mm: 1.30
        why_no_verdict: "底孔不适用 PX02（见该准则 does_not_apply_to）。Ø1.6 底孔实际打成 Ø1.3 意味着 M2 自攻单边要挤 0.35 mm 塑料，拧入扭矩和胀裂风险都上升 —— 但本仓库**没有任何判据**能把『挤压量』变成红绿（既没有 PLA 的许用挤压量，也没有拧入扭矩数据，见 bench.yaml:BN01）。同一条目 status 已经是 inconsistent（Ø1.6 与 Ø1.7 并存）。"
      - key: "fits.pla.bearing_outer_seat_6704"
        design_mm: 27.15
        effective_mm: 26.85
        why_no_verdict: "轴承座是内轮廓，适用 0.15/边：Ø27 外圈进 Ø26.85 的孔 = **直径 0.15 过盈**。该条目 status 本来就是 mismatch_nominal_vs_target（名义 27.15 是 +0.15 间隙，target 要求 −0.05~+0.05 干涉）—— 偏移恰好把它推进 target 区间的**外侧**（0.15 干涉 > 0.05 上限）。不下判决是因为 TC01_bearing 座孔规（Ø27.0/27.15/27.3/27.45 四个孔）**才是这一条的直接锚点**，比拿 M2 孔规的 0.15 外推到 Ø27 更可信 —— 而它有没有被打印、有没有读数，本仓库都没有记录。Ø2.3 的小孔和 Ø27 的大孔缩量不一定相同（小孔多一份弦高/流量补偿效应）。"
      - key: "fits.pla.bearing_outer_seat_6700"
        design_mm: 15.1
        effective_mm: 14.80
        why_no_verdict: "同上：Ø15 外圈进 Ø14.80 = 直径 0.20 过盈。该条目 nominal 的 src 是 measured（射线量导出 STL 得 15.093–15.100），但那是**量 CAD**，不是量打印件 —— offset 是 CAD→实物这一段的偏差，两者不冲突、在直径上**相加**（CAD 15.093 已经基本等于名义 15.1，再减 0.30 得 14.80）。直接锚点同样是 TC01_bearing —— 无打印记录、无读数。"
    unscreened_because_convention_undeclared:
      _why: "下面这些桶的 nominal 判不出是直径量还是单边量（既没有 gate_must_use.quantity，meaning 里也没写『单边』/『直径』）。按元规则 3/4，判不出口径 = unknown，不许挑一个算了完事。"
      keys:
        - "fits.servo.back_clamp"
        - "fits.servo.cage_clearance"
        - "fits.servo.overload_stop"
        - "fits.battery_bay"
        - "fits.deck.deck_to_L01_gap"
        - "fits.deck.keyhole"
        - "fits.snap.b01"
        - "fits.horn.face_contact"
        - "fits.pla.bearing_face"
  what_would_make_it_a_criterion:
    - "层里写出读 process.xy_offset_mm_per_side 的代码，并逐条 fits 按上面两条 expr 判红绿 —— 现在一行都没有"
    - "每条 fits 补一个显式的 quantity 字段（diametral / per_side），否则一半的桶只能判 unknown"
    - "外轮廓与横孔各自的 offset（TC01b / TC02b 已打，回读数即可），否则榫、毂、轴颈、侧壁过孔一律 unknown"
    - "切片补偿这条路要能被验证：补偿参数写进 tools/gate/slicing/ 的切片配置并留哈希，再打一次 TC02 复量 —— 否则『已补偿』只是一句口头承诺，判据既证实不了也证伪不了"
  slicer_compensation_decision:
    decided_by_user_on: "2026-09-10"
    decision: "不改 CAD，改由打印店在切片里做孔径补偿"
    slicer_parameter_names: ["Bambu Studio / OrcaSlicer: hole_size_compensation", "Cura: X-Y hole compensation（Hole Horizontal Expansion）", "PrusaSlicer: Hole Horizontal Expansion（XY hole compensation）"]
    value_to_ask_for_mm: "+0.30（直径）/ 等价 +0.15 单边。切片器里这个参数一般填**直径方向**的增量，填之前跟打印店确认它家 UI 的口径 —— 填成 0.15 只补一半。"
    verification_status:
      v: null
