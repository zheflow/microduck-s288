    static_torque_margin:
      v: null
      src: null
      unknown_class: "not_selected"
      unknown_reason: "README 第 7 层要求'每关节静扭矩 < S288 额定 × 系数'，系数未定；S288 额定扭矩也没抄进 inventory"
      # ── 2026-09-09：额定扭矩已经抄进本文件了（见下面 rated_stall_torque_Nm / load.servo_rated_torque_Nm），
      #    但**系数本身继续拒填**。下面把拒填的理由写成机器可读的，免得后面有人随手填个 0.5 就把 14 个关节判绿。
      corrected_2026-09-09: "原 unknown_reason 后半句『S288 额定扭矩也没抄进 inventory』已不再成立 —— 名义堵转 0.6 N·m 已写进 tolerances.yaml:load.servo_rated_torque_Nm.stall_torque_Nm 与本桶 rated_stall_torque_Nm。前半句（系数未定）依然成立，且是**主动拒填**，不是漏填。旧值 null 保持不变。"
      refused_2026-09-09: "**拒填**。本系数的物理含义是『静态保持时允许占堵转的比例』，也就是 S288 的连续/保持扭矩降额。这个量在本仓库和手册里都不存在（load.servo_rated_torque_Nm.continuous_torque_Nm = null）。任何具体数字都会变成一个凭空的门槛，而它直接决定 14 个关节判绿判红 —— 按元规则 4，宁可留红。"
      forbidden_derivations:
        - id: "FD1"
          what: "拿 0.32 A（最大线电流）× 0.554 N·m/A（扭矩常数）= 0.177 N·m 当连续扭矩"
          why_forbidden: "第6项_离线验证报告.md:108 明令禁止：『还需澄清名义最大线电流 0.32 A 和扭矩常数 0.554 N·m/A 分别指电源侧/相电流/转子侧还是输出侧；不能把不同口径的电流与 0.6 N·m 堵转值直接套同一公式』。而且 0.177 ≠ 0.6 本身就证明两个口径对不上（若都在输出侧，堵转应当就是 0.177）。"
        - id: "FD2"
          what: "取 margin = 1.0（『静态保持不可能超过堵转』这个物理上界）"
          why_forbidden: "1.0 只是必要条件，不是通过条件。填 1.0 会让 14 个关节的 torque_criteria 直接消失、static_torque 判 PASS —— 那正是本体系立意里最危险的一类：『检查了、通过了、但查的东西不对』。层现在就是按 margin=1 只报必要条件，并同时留一条红，这是对的。"
        - id: "FD3"
          what: "拿离线回放峰值（≤0.396 N·m）除以 0.6 声称有裕量"
          why_forbidden: "第6项_离线验证报告.md:63 原句就是在禁止这件事：『不能用本次 0.396 N·m 以下的峰值除以 S288 名义堵转 0.6 N·m，声称有实际扭矩裕量。持续扭矩、温升和负载下扭矩-转速曲线均未知』。"
      what_would_unblock: "bench.yaml:BN13 实测堵转 → 回填 load.servo_rated_torque_Nm.measured_stall_torque_Nm；bench.yaml:BN03 温升 → 给出可持续保持的扭矩水平 → 填 continuous_torque_Nm；系数 = continuous_torque_Nm ÷ stall_torque_Nm，那时才是有出处的数。"
      bench_ref:
