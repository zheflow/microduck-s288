  # ── 2026-09-09 新增：质量/惯量漂移桶（README 第 2 节 L7『与 MJCF <inertial> 逐 body 比漂移』）──
  # 阈值的出处不是拍脑袋，是**训练时真正用过的域随机化范围**：策略只见过这个范围内的机器人，
  # 超出去就等于策略没见过 → README 第 5 节 DoD：更新 MJCF <inertial> 并标注是否重训。
  mass_drift_vs_mjcf:
    mass_g:
      v: 0.286
      src: "datasheet"
      src_note: "= MJCF 里最小 body（neck_pitch，5.720 g）的 5%。5% 的出处：upstream/microduck_rl@5946fd9 src/mjlab_microduck/tasks/microduck_velocity_env_cfg.py:73 `MASS_INERTIA_RANDOMIZATION_RANGE = (0.95, 1.05)  # ±5% applied to BOTH mass and inertia together`。"
      why_absolute_and_why_the_smallest_body: "训练里的判据是**相对**的（±5%），层读的是**绝对**克数（`abs(d_m) <= drift_m`）。把相对退化成绝对时只能取最小 body 上的绝对值 —— 否则拿 trunk_base 的 5%（9.96 g）当全局阈值，会把 neck_pitch 放行到 174%。取 0.286 g 是保守方向。"
      robustness_check_2026-09-09: "这个退化不影响结论：逐 body 按**相对** 5% 重算，15 个 body 一个都不满足（最小的是 upper_leg_left/right 的 +4.420/48.207 = 9.2%，最大的是 yaw_roll_motion 的 −19.810/48.600 = 40.8%）。所以无论用 0.286 g 绝对判据还是 ±5% 相对判据，结果都是 15/15 红。"
      harsher_reading: "而且 ±5% 这条本身**只对 trunk_base 生效** —— 同一个文件 line 452-469 里 `dr.pseudo_inertia` 的 `body_names=(\"trunk_base\",)`。其余 14 个 body 在训练里质量/惯量随机化是 **0**，严格讲它们的容差是 0 g。0 没法当工程门槛（浮点噪声就过不了），所以本键取了『最小 body 的 5%』这个已经放宽过的值。"
    com_mm:
      v: 3.0
      src: "datasheet"
      src_note: "= 训练里质心随机化的**基线**幅度 ±3 mm。出处：同一文件 line 57 `COM_RANDOMIZATION_RANGE = 0.003  # ±3mm initial, ramped to ±8mm via curriculum` 与 line 65 `HEAD_COM_RANDOMIZATION_RANGE = 0.003`。注意那句注释里的『±8mm』**是过时的**：实际 range_stages（cfg:855-868 / 877-883）trunk 爬到 0.015、head 爬到 0.01。基线 0.003 两处一致，是可用的。"
      why_the_baseline_not_the_ramped_value: "curriculum（line 850-880）会把 trunk 爬到 ±15 mm、头部爬到 ±10 mm，但**没有证据证明 baseline_xl330 那次训练跑满了 curriculum**（第6项_离线验证报告.md:26 只记了 ONNX 的 sha256 和接口，没记训练步数）。跑没跑满不知道 → 按元规则 4 取 step 0 的 ±3 mm。"
      cross_check: "本仓库自己的敏感性实验给出同一量级：第6项_离线验证报告.md:73-78，打印材料 1.0×→0.4× 均匀缩放，HOME 重心水平移动 2.676 mm；CAD 模型与原 XML 的 HOME 重心水平差 2.605 mm。两个独立来源都指向『几 mm』。"
    by_body:
      _note: "上面那对标量是层现在能读的全部。真判据应该按 body 分桶，因为训练里的随机化本来就是分组施加的。等层支持了，用下面这张表。"
      trunk_base:
        mass_rel: {v: 0.05, src: "datasheet", src_note: "dr.pseudo_inertia body_names=('trunk_base',)，alpha_range 由 (0.95,1.05) 推出（cfg:452-469）"}
        com_mm: {v: 3.0, src: "datasheet", src_note: "randomize_com 只作用在 trunk_base（cfg:413-422）；curriculum 上限 15 mm（cfg:855-868，2026-07 审计从 30 mm 砍到 15 mm，理由是『超出脚支撑多边形，脚跟只在踝后 20 mm』）"}
        com_mm_if_curriculum_completed: 15.0
      head_group:
        grouping_is_the_training_configs_not_ours: true
        bodies: ["neck", "neck_pitch", "yaw_roll_motion", "jaw_soft", "bearing_roll"]
        bodies_src: "cfg:66-72 HEAD_BODY_NAMES = (neck, neck_pitch, yaw_roll_motion, (bottom_head_shell|jaw_soft), bearing_roll) —— **逐字照抄训练配置**，不是我们按解剖学分的组。"
