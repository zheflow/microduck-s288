      what_it_is: "**S288 自己输出轴上那颗轴承**的额定载荷 —— 不是我们外购的 6704/6700。relations.yaml:C2_missing_bearing_load 说的是相对原版少掉的 7 颗外部轴承（髋偏航×2 髋俯仰×2 头偏航×1 头横滚 A/B×2 —— 与 relations.yaml:C2.joints_actually_dropped 和 bench.yaml:BN08.corrected_2026-09-09 一致；髋横滚与膝那 4 颗 6704 是**留着的**，不在这 7 颗里），这 7 处现在整根悬臂都压在 S288 自带输出轴承上，所以要拿这个额定去比。"
      searched_2026-09-09:
        - "V2_S288版发布产物/04_电机到货测试/S288实测尺寸记录.md:55-56（2026-09-08 客服参数表）—— 只有 19.5 g / 0.6 N·m 堵转 / 0.32 A / 0.27 A 空载 / 16.5 rad/s / 6.4–12.6 V / 0.554 N·m/A / 15 bit 编码器 / 6 Mbps；**没有任何轴承载荷条目**"
