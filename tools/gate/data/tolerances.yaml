    #    s288_metal_thread 改挂到这里。**这次改动的净效果是把绿变红**，这是对的：原来那些绿是拿
    #    金属内螺纹的阈值去判塑料自攻得来的，属于元规则 10 要抓的「查了、过了、但查的东西不对」。
    range_mm:
      min: null
      max: null
    unknown_class: "not_measured"
    unknown_reason: "塑料自攻的可接受咬入区间**本仓库没有任何数据**。① 宇树没给：docs/reference/s288/给宇树客服的问题清单_2026-09-10.md:47 第 5 节问了牙型、拧入扭矩上限、可反复拆装次数，2026-09-10 未回；官方图只规定了孔（Ø1.7 光孔、⌄3.0 MAX），没规定咬入。② 本仓库没测：bench.yaml:BN01 是提出来的实测项，checked=false。③ **不许从 s288_metal_thread 的 1.8–3.0 挪过来**：塑料自攻靠的是牙侧挤压塑料产生的径向抱紧力，金属内螺纹靠的是牙的剪切面积，一般塑料自攻需要**更长**的咬入（常见工程惯例 ≥2×螺径，M2 即 ≥4.0），而 S288 的孔深上限只有 3.0 —— 这两个数一旦都写实，很可能得出『这个连接本来就不够』的结论，正因为如此更不许随手填一个能通过的数。"
    why_range_is_null_and_not_4_0: "pla_self_tap 桶用的 4.0（=2×螺径）是打印件 PLA 的惯例值，src 也只是 rule 里的一句话。舵机塑料壳是**注塑件**、牌号未知（PA/POM/ABS 都可能），壁厚与孔深由官方图定死在 3.0 —— 把 PLA 的 4.0 搬过来既没有出处，也会让 19 组全部因『3.0 < 4.0』判红，红得不是地方。填 null 让层判 unknown（元规则 3），红在『没有判据』上，理由是真的。"
    hard_cap_mm:
      v: 3.0
      src: "datasheet"
      src_note: "官方尺寸图：法兰 6-Ø1.7 ⌄3.0(MAX)、背面 4 角孔 16×30 Ø1.7 光孔深 ≤3.0（S288实测尺寸记录.md:44、给宇树客服的问题清单_2026-09-10.md:47）。这是**孔的盲深**，是几何量，和牙是金属还是塑料无关 —— 所以本键有值、range_mm 没值，两者不矛盾：孔多深是知道的，多深才算拧住是不知道的。超过 3.0 就顶底。"
      changed_2026-09-10: "值没变（还是 3.0），但 src 从 assumed 升到 datasheet：s288_metal_thread 那条写的是『官方图，未量』，其实官方图就是数据表出处。"
    rule: "长度判据取 tolerances.yaml:screw_length_rule.formula（螺丝总长 ≤ 叠厚 + 盲深 − 0.3），本桶提供该公式里的『盲深』= hard_cap_mm = 3.0。**咬入区间本桶给不出**（range_mm 两端都是 null）→ 第 5 层对这 19 组的 `engagement` 判 unknown（= 红），19/19 全红（2026-09-10 实跑 gate.py --layers 5 核实）。这是有意的：数据缺失必须变成红格，不许静默跳过。"
    correction_2026-09-10: "本键原文写的是『……engagement_declared / engagement_derived 两条随之失去阈值』。**实跑核实这句话是错的**：engagement_declared / engagement_derived / engagement_per_hole 各 9 条，全部落在 pla_self_tap 那 8 组上，s288_plastic_self_tap 的 19 组一条都没有 —— 这 19 组只产出 `engagement` 一条判据。原句把没发生的事说成发生了（元规则 9）。"
    authoritative_length_rule_ref: "tolerances.yaml:screw_length_rule"
    blind_depth_for_formula_ref: "tolerances.yaml:engagement_by_joint_type.s288_plastic_self_tap.hard_cap_mm"
    thread_form_guidance:
      recommended: "PT 型（挤压式三角牙）"
      is_not_an_answer: "**这是工程惯例，不是宇树答复，也不是本仓实测。** 所以它只出现在本键和各组的 screw_type.thread_form.candidate 里，不出现在任何 v: 上。"
      why: "塑料自攻要挤压成型、不要切削。切削型（尖头自攻 / 割尾自攻）在注塑壳里会切出塑料屑、切断分子链，屑还会掉进减速箱；挤压型三角牙把材料推开形成连续的牙，同一个孔能多拧几次。S288 全塑料（塑料齿轮 + 塑料壳，宇树 2026-09-08 参数表，用户实物确认），减速箱就在螺丝孔背后。"
      falsified_by: "宇树给出牙型答复；或 bench.yaml:BN01 用两种牙型各拧一颗做拆装对比。"
    max_reinsertions_ref: "fasteners.yaml:<组>.max_reinsertions（全部 null，unknown_class: not_measured）"
    why_replaced_s288_metal_thread: "S288 是**塑料齿轮 + 塑料壳**（宇树客服 2026-09-08 官方参数表原文，抄在 V2_S288版发布产物/04_电机到货测试/S288实测尺寸记录.md:56；J288 才是钢齿、铝壳、35 g、25.2 V、1.5 N·m）。用户已拿实物确认全塑料。官方尺寸图对两款的规定本来就不同：S288 是『6-Ø1.7 ⌄3.0(MAX) 使用 M2 自攻螺丝』+ 背面 4 角孔 Ø1.7 光孔，J288 才是『4-M2螺纹 ⌄3.0(MAX)』+ 2-Ø2 销钉。也就是说 S288 上**没有任何金属内螺纹**，原来 19 组 128 颗写 s288_metal_thread 是把 J288 的规定套在了 S288 上。"
    consequences_of_the_fix: "① 咬入判据从『有阈值、大部分绿』变成『无阈值、全 unknown（红）』—— 少了假绿，多了诚实的红。② 螺丝长度规则不受影响：它只要盲深，盲深还是 3.0（官方图）。③ 采购口径变了：157 颗全是自攻，牙型未定，现在不能下单（fasteners.yaml:counts.self_tapping_audit_2026-09-10.consequences_for_purchasing）。"
