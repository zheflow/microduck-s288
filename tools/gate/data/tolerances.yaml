  # ── 2026-09-09 新增：惯量**分布**漂移桶（补 FG20：L7 此前一个字节都没读过 <inertial> 的惯量项）──
  # 上面的 mass_drift_vs_mjcf 只管"多重、质心在哪"。质量对上、质心对上、而料从中间挪到两端，
  # 惯量可以差一倍，策略训练时用的转动惯量和实物分家 —— 那正是这一桶要管的。
  # 层（l7_mass.py:_inertia_body）两边都对角化成主惯量三元组（坐标系无关）再逐个比，另比主轴夹角。
  inertia_drift_vs_mjcf:
    _what_the_layer_measures: "CAD 侧：每个 body 上的打印件实体（trimesh.moment_inertia × density_g_cm3）+ 该 body 挂的元件（placed 包络实体配 components.yaml:mass_g 反算的均匀密度），按平行轴定理搬到该 body 的 CAD 质心相加，得到关于质心、body 轴下的全张量；MJCF 侧：robot_walk.xml 的 <inertial fullinertia>（本模型 15 个 body 全是这种写法）或 <inertial diaginertia + quat>，kg·m² × 1e9 → g·mm²。两边各自 numpy.linalg.eigh 对角化，主惯量升序逐个比相对差，主轴逐个比夹角（特征向量符号任意 → 取 |cos|）。"
    principal_moment_rel:
      v: null
      src: null
      unknown_class: "not_selected"
      unknown_reason: "主惯量相对漂移上限未决定。"
      refused_2026-09-09: "**拒填**，理由和 static_torque_margin 同一类，但更硬：唯一看起来像出处的东西 —— upstream/microduck_rl@5946fd9 microduck_velocity_env_cfg.py:73 `MASS_INERTIA_RANDOMIZATION_RANGE = (0.95, 1.05)  # ±5% applied to BOTH mass and inertia together` —— **约束不了这个量**。它经 cfg:452-469 落到 `dr.pseudo_inertia`，注释写得很清楚：`alpha scales BOTH mass and inertia by e^(2*alpha) with the CoM unchanged`。e^(2α) 是**各向同性标量缩放**：三个主惯量同乘一个数、主轴朝向一动不动、主惯量之比一动不动。也就是说训练见过的是『整体重一点轻一点』，从来没见过『分布变了』。拿 ±5% 当分布容差，等于把一个缩放容差当成形状容差用，是典型的『查的东西不对』。"
      also_only_trunk_base: "而且 dr.pseudo_inertia 的 `body_names=('trunk_base',)` —— 其余 14 个 body 在训练里连这个各向同性缩放都没有，严格讲容差是 0。"
      what_would_unblock:
        - "训练侧：把域随机化换成**各向异性**的惯量随机化（例如对主惯量三元组独立缩放，或直接随机化 fullinertia 的 6 个分量），那时它的范围才是这一条的合法出处。"
        - "或者：跑一次 sim2sim / 策略回放敏感性实验 —— 把 MJCF 的 <inertial> 换成本层算出来的 CAD 张量，看策略跟踪误差退化多少，用『退化到不可接受』那一点反推容差。本仓库有现成的离线回放通道（docs/six_checks_2026-09-08/policy/第6项_离线验证报告.md），但那次只跑了质量均匀缩放，没跑惯量。"
        - "在那之前留 null 判红。填任何数都会让 15 个 body 的 inertia_criteria 一起变绿，而绿的依据是编的。"
      measured_today_for_reference:
        note: "2026-09-09 首次量到的现值，**只是量，不是判据**。见本轮 scorecard.json:L7/body:*.principal_inertia_vs_mjcf。"
        src: "measured"
    principal_axis_deg:
      v: null
      src: null
      unknown_class: "not_selected"
      unknown_reason: "主轴朝向偏差上限未决定。"
      refused_2026-09-09: "**拒填**。同上：e^(2α) 缩放保持主轴不变，所以训练里主轴的容差恰好是 **0°**。0° 不能当工程门槛（对角化的数值噪声就过不了），而任何非 0 的数都没有出处。另外这条判据本身有一个必须一起看的限制：当某个 body 的两个主惯量接近简并时，主轴在那个平面内本来就不唯一，夹角再大也不代表分布错 —— 层里已经把 MJCF 主惯量的相对间隔一起报出来（间隔 < 2% 时明说『不可解释』），定阈值时必须把简并 body 单独处理。"
      what_would_unblock: "同 principal_moment_rel。"
    modeling_caveats_2026-09-09:
      - "元件（舵机、电池、原版件）在 CAD 侧是按 placed 里的**包络实体 + 均匀密度**建的模，包络里的真实分布（S288 的转子/减速箱、电池的卷芯、主板的元器件）没有任何数据。层每条 principal_inertia_vs_mjcf 都同时报出『把所有项退化成质点后主惯量会变多少』，那个数就是本判据自身的建模不确定度 —— 定阈值前必须先确认它比阈值小。"
      - "打印件按**实心**体积算（见 density_by_material.infill_upper_bound_note），实际是壳+填充。实心假设对惯量的影响方向和对质量的不一样：填充在中性面附近，实心会同时高估质量和高估回转半径。"
      - "CAD 侧还漏着一批没有 mass_g 的元件（6 颗轴承、主板、摄像头、屏、麦），它们进不了张量。"
    provenance:
      - "upstream/microduck_rl@5946fd9 src/mjlab_microduck/tasks/microduck_velocity_env_cfg.py:73,452-469"
      - "upstream/microduck_rl/src/mjlab_microduck/robot/microduck/robot_walk.xml:<inertial fullinertia>"
      - "tools/gate/README.md 第 2 节 L7（『与 MJCF <inertial> 逐 body 比漂移』）"
      - "tools/gate/layers/l7_mass.py:_mjcf_inertial / _inertia_body"
  # ── 2026-09-09 新增：静态稳定余量 ──────────────────────────────────────────
  static_stability_margin_mm:
    v: 3.0
    src: "assumed"
    src_note: "重心水平投影到支撑多边形边界的最小允许距离。"
    assumption_basis: "两个互不相干的来源都落在 3 mm：① 训练时施加在 trunk_base / 头部的质心随机化基线就是 ±3 mm（microduck_velocity_env_cfg.py:57,65）——策略被训练成能容忍这么大的质心不确定度，反过来说余量小于它，『重心在多边形内』这个结论就淹没在训练自己的噪声里；② 本仓库的质量模型不确定度也是这个量级（第6项_离线验证报告.md:73-78：打印材料 1.0×→0.4× 均匀缩放，HOME 重心水平移动 2.676 mm；CAD 与原 XML 的 HOME 重心水平差 2.605 mm）。取 3.0 = 两者的公共量级。"
    what_would_overturn_it:
      - "称重（bench.yaml:BN15）把质量模型的不确定度压到 1 mm 以内 → 可以下调"
      - "把现在缺的 17 类元件（尤其头部电子件，力臂最长）补进 CAD 并重算重心 → 不确定度重新评估"
      - "证明 baseline_xl330 训练跑满了 com curriculum（trunk 到 ±15 mm）→ 上调到 15 mm"
      - "**任何动态判据都不能用这个数** —— 它是静态保持的余量，走路/落地要另立（README 第 2 节把动态明确划给 bench）"
    not_a_dynamic_criterion: true
    provenance:
      - "upstream/microduck_rl@5946fd9 src/mjlab_microduck/tasks/microduck_velocity_env_cfg.py:57,65"
      - "docs/six_checks_2026-09-08/policy/第6项_离线验证报告.md:73-78"
      - "tools/gate/README.md 第 2 节 L7"
  # ── 2026-09-09 新增：S288 额定扭矩的**唯一权威定义**（bench.yaml:BN13 的回填目标）──────────
