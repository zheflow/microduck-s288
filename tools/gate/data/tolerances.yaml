        - "条件：母线 12.0 V 台架电源，饱和时掉到 11.5 V；绕组 45→90 ℃（停滞段每秒 +4 ℃）。BN13 写的 12.6 V 未满足；满电 12.6 V 冷态可能略高，按 0.66 用是保守侧。"
        - "这是瞬时上限，不是可持续扭矩：顶死 6 s 绕组就从 55 到 80 ℃（continuous_torque_Nm 仍 null，靠 BN03 或整机走行温度观测）。固件过热报警到 90 ℃ 还没响。"
        - "与 datasheet 0.6 一致（+10%）；与第一轮 BAM 位置数据拟出的电压极限 0.56 一致。BAM 最终参数里上限由吊瓶日志参与拟合（04_电机到货测试/params/s288/）。"
      bench_ref: "bench.yaml:BN13"
