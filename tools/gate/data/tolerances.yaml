      what_would_unblock: "① 宇树给出 S288 输出端径向/轴向承载规格；或 ② bench.yaml:BN08 实测 7 处旷量增量，用『旷量不超标』代替『载荷不超额定』作为判据（README 第 2 节把耐久明确划给 bench）"
      bench_ref: "bench.yaml:BN08"
      cs_reply_2026-09-17:
        asked: "输出轴支承方式（滚珠/衬套）；法兰允许径向力/弯矩，我们最坏 0.38 N·m 侧向弯矩能否长期承受；回差；编码器分辨率；14 节点总线一轮 ms；持续扭矩"
        answer_verbatim: "0.38 N·m 长期工作应该没问题；输出轴的支承找相关同事确定下后反馈；其余看 support.unitree.com/home/zh/J288-S288 Servo/About_J288-S288"
