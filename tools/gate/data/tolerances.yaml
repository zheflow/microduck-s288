  # ── 2026-09-09 新增：头部可加质量预算（components.yaml 里未选型件的 budget_g 的来源）────────
  head_added_mass_budget_g:
    v: 509.8
    src: "measured"
    src_note: "本仓库 Gate L7 自己算出来的：tools/gate/out/scorecard.json 的 L7/_load.head_mass_budget（2026-09-09 那次 `gate.py --layers 7 --skip-negatives`）。附加质量假设放在头部 body jaw_soft 现有质心 (5.4, −1.9, −21.8) mm（本体系），当前头部 133.6 g。卡脖子的关节是 neck_pitch（空载全程峰值 0.1565 N·m）；其余承载关节的预算 head_pitch=1410 g、head_roll=15092 g、head_yaw 不限（轴与重力平行）。"
    computed_at_margin: 1.0
    upper_bound_only: "**这是 margin=1 的上界，不是可用预算。** 层是拿名义堵转 0.6 N·m 当门槛二分出来的；0.6 是堵转不是可持续输出（见 servo_rated_torque_Nm）。"
    sensitivity_illustration:
      note: "**这是灵敏度演示，不是阈值，别拿去当判据。** neck_pitch 的静扭矩对附加质量近似线性：τ ≈ 0.1565 + m_add × (0.6−0.1565)/509.8 = 0.1565 + m_add × 8.70e-4 N·m/g。"
      formula: "budget(margin) ≈ (0.6 × margin − 0.1565) ÷ 8.70e-4  [g]"
      examples: ["margin=1.00 → 509.8 g（层现在报的数）", "margin=0.50 → 165 g", "margin=0.30 → 27 g", "margin≤0.261 → 0 g（空载就已经超了）"]
      why_it_matters: "主控 Radxa ZERO 3W 一件就 14 g（占位值，借 Orange Pi 规格）。如果 S288 的可持续扭矩只有堵转的三成，头部电子件的总预算就只剩几十克，摄像头+麦+转接板+UBEC 必须一起算（**屏已取消**，见 docs/README.md 顶部横幅；原文『摄像头+屏+麦+基准板四件』作废）。**在 continuous_torque_Nm 测出来之前，509.8 g 这个数不能拿去做选型决策。**"
      margin_is_null_today: true
    consumed_by: "components.yaml 里未选型头部件的 budget_g（camera_csi / display_lcd / mic_inmp441 / sensor_small_boards）"
    bench_ref:
      - "bench.yaml:BN13"
      - "bench.yaml:BN15"
    provenance:
      - "tools/gate/out/scorecard.json:L7/_load.head_mass_budget"
      - "tools/gate/README.md 第 4 节 mass_budget.md"
