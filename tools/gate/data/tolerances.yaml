      unknown_class: "not_verified"
      unknown_reason: "补偿有没有被真的设进切片、设的是哪个数、设完之后孔径回没回到名义值 —— 三件事一件都没有证据。在拿到『补偿后重打的 TC02 读数』之前，上面 screened_2026-09-10 那张表就是这批件的实际状态。"
