  density_g_cm3:
    v: 1.27
    src: "assumed"
    src_note: "打印清单假设值，用于第 7 层质量估算"
    # ── 2026-09-10 新增：与上游 MJCF <inertial> 的**密度口径差**（独立复算过，不是抄复审结论）──
    vs_upstream_mjcf_implied_density:
      _why_this_is_here: "L7 的逐 body 质量/惯量漂移是拿『我们的 CAD 质量』去比 upstream/microduck_rl/.../robot_walk.xml 的 <inertial mass>。但那份 XML 的质量不是称出来的，是 onshape-to-robot 用**它自己的**材料密度从 CAD 算的。两边密度口径不同的话，漂移里有一份**系统偏置**，跟几何差异混在一起。本条把这个偏置量化出来，让『漂移 = 我们的件真的不一样』这句话不再包含一个没被说出口的密度假设。"
      implied_plastic_density_g_cm3:
        v: 1.0521
        src: "measured"
        src_note: "**本轮独立复算得到，不是引用复审数字。** 方法：解析 upstream/microduck_rl/src/mjlab_microduck/robot/microduck/robot_walk.xml 的 15 个 <body>，每个 body 按 (mesh, pos, quat) 去重收集 <geom type=\"mesh\">（visual / collision / self_collision_only 同姿态同网格算一个实体），用 trimesh 读 assets/*.stl 求体积（STL 单位是 m，×1e6 得 cm³），对每个 body 列一条方程 mass_g = ρ·Σ(打印件体积) + n_xl330·m_xl330 + n_bearing22x16x4·m_bearing，三个未知数用 numpy.linalg.lstsq 最小二乘解。"
        solved_together_with:
          xl330_g: 18.0011
          bearing_22x16x4_g: 1.4166
        residual_max_g: 0.01715
        src_is_measured_means: "本键 src 写 measured 沿用本仓库既有口径：『从文件里量出来的』（同 fits.* 里那些『射线量导出 STL』的条目）。**不是**拿秤称的，也**不是**宇树/上游给的数据表值 —— 它是从上游 XML 的 <inertial mass> 和 assets/*.stl 体积反解出来的。"
        why_1_0521_and_not_1_0522: "复审报 1.0522，本轮独立复算报 1.0521。差 0.0001 来自取哪一组 7 body（hip_l 与 hip_l_2、yaw2roll 与 bearing_roll、leg 与 leg_2 互为镜像，穷举时存在多组并列解）。这个差比 residual 还小一个量级，对 +20.7% 的结论没有任何影响。"
        fitted_bodies_n: 7
        fitted_bodies: ["yaw2roll", "hip_l", "leg", "neck", "neck_pitch", "bearing_roll", "leg_2"]
        fitted_bodies_note: "这 7 条里 bearing_roll 是 yaw2roll 的镜像、leg_2 是 leg 的镜像，网格与元件构成完全相同 → **独立方程其实只有 5 条**（yaw2roll / hip_l / leg / neck / neck_pitch），解 3 个未知数。残差 0.017 g 说明拟合很紧，但『独立方程 5 条』这个事实必须写出来，不许拿 7 报成 7 个独立证据（元规则 2）。"
        how_the_7_were_chosen: "在 11 个『非打印件只有 xl330 + 22x16x4 轴承』的 body 里穷举子集，取**最大的、残差 <0.02 g 的**那一组。不是先挑好再报残差 —— 全 11 条一起解会得到 ρ = −0.80 g/cm³（负密度，物理上不可能），说明有 body 带着模型外的质量，见 bodies_that_do_not_fit。"
      bodies_that_do_not_fit:
        _what: "拿上面解出的 (1.0521, 18.0011, 1.4166) 回代**全部 15 个 body**，剩下这些对不上。它们的差值不能用密度解释，说明上游 XML 里这些 body 挂着 mesh 之外的质量（电池、树莓派、屏、摄像头、扬声器等，或干脆是人工填的圆数）。"
        rows:
          - {body: "trunk_base",      mjcf_g: 199.2240, explained_g: 129.8754, unexplained_g: 69.3486, note: "np_f970 电池网格已计入打印件体积（51.6 cm³），却仍差 69 g —— 电池实体重量显然不是按塑料密度算的"}
          - {body: "jaw_soft",        mjcf_g: 188.7660, explained_g: 158.6100, unexplained_g: 30.1560, note: "头部：树莓派 / 屏 / 摄像头 / 扬声器 / 镜头都在这个 body 上"}
          - {body: "yaw_roll_motion", mjcf_g:  48.6000, explained_g:  25.6276, unexplained_g: 22.9724, note: "48.6000 是个可疑的圆数，差出整整一颗 xl330 多一点"}
          - {body: "upper_leg_left",  mjcf_g:  48.2067, explained_g:  42.5715, unexplained_g:  5.6352}
          - {body: "upper_leg_right", mjcf_g:  48.2067, explained_g:  42.5719, unexplained_g:  5.6348}
          - {body: "ankle_left",      mjcf_g:  30.0246, explained_g:  27.6775, unexplained_g:  2.3471, note: "鞋底 sole_left 在上游是 TPU，按 1.0521 的塑料密度算必然偏轻"}
          - {body: "ankle_right",     mjcf_g:  30.0251, explained_g:  27.6774, unexplained_g:  2.3477}
        what_this_limits: "**1.0521 只是 5 条独立方程约束出来的数，不是『上游全机的塑料密度』。** 上面 7 个 body 占 MJCF 总质量 737.24 g 的一大半，它们对密度没有提供任何约束（未知量太多）。所以下面那个 +20.7% 的偏置，严格讲只对『构成干净的那几个 body』成立；对 trunk_base / jaw_soft 这种电子件为主的 body，密度口径差不是它们漂移的主要成因。"
      caliber_gap_vs_our_1_27:
        ratio: 1.207079
        percent: 20.708
        statement: "拿我们的质量去比上游 <inertial> 时，**含 +20.7% 的系统偏置** —— 同样的几何、同样的实心假设，我们会算得比上游重 20.7%。这个偏置是密度口径造成的，不是件不一样造成的。"
        vs_pla_tds_1_24: "就算把我们的 1.27 换成 PLA TDS 的 1.24（density_by_material.pla.solid_g_cm3），偏置仍有 +17.86% —— 说明**上游用的根本不是 PLA 的实心密度**（1.05 更接近 ABS 1.04，或者是 PLA 打了 ~85% 有效填充后的等效密度），不是我们的 1.27 挑错了牌号。"
      how_to_use_this:
        do: "读 L7 的逐 body 质量漂移时，先记住其中有一份 +20.7% 的口径偏置；判『这个 body 的几何真的变了吗』要把偏置扣掉再看。"
        do_not: "**不许拿 1.0521 去替换 density_g_cm3。** 1.0521 是『能让上游 XML 自洽』的数，不是我们这批件的真实密度 —— 我们的件是不同的几何、不同的材料、不同的填充率。用它只会把 L7 变成『我们的 CAD 反推出的上游密度 → 再乘回去比上游』这种同义反复（元规则 10）。"
        do_not_2: "**也不许把 L7 的比较基准从上游 robot_walk.xml 改指向 sim/duck_s288/robot_walk_s288.xml。** 后者的 <inertial> 是 tools/sim/make_mjcf.py 用**和 L7 同一批 CAD 网格、同一个 density_g_cm3** 生成的，指过去会让漂移恒等于 0，是更隐蔽的假绿。"
        the_real_fix: "bench.yaml:BN15 逐件称重 → density_by_material.*.effective_g_cm3 落地。称完之后我们这边就不再有密度假设，届时与上游的差就是纯几何差 + 上游自己的密度假设，可以只讨论一边。"
      reproduce: "./.venv/bin/python 读 robot_walk.xml + trimesh 读 assets/*.stl，按 src_note 的方法重跑即可。复审（2026-09-10）用同样方法报的是 1.0522 / 18.001 / 1.415 / 残差 0.017 —— 本轮独立复算得 1.0521 / 18.0011 / 1.4166 / 0.01715，两者在 4 位有效数字内一致，**结论采信**。"
      provenance:
        - "upstream/microduck_rl/src/mjlab_microduck/robot/microduck/robot_walk.xml（15 个 <inertial mass>）"
        - "upstream/microduck_rl/src/mjlab_microduck/robot/microduck/assets/*.stl（体积）"
        - "tools/sim/make_mjcf.py:48（我们这边用的 1.27）"
        - "tools/gate/data/tolerances.yaml:load.density_g_cm3（1.27 的源头，src: assumed）"
