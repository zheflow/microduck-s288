  - id: "D-PART-01"
    what: "face_part 被算进'原版件'，但既不在冻结的 6 个 STL 里，也不在 17 件里"
    a: "inventory_v2.json:purchased[16] —— original_prints qty=4，model 里却列了 5 个名字：top_head_shell / jaw / jaw_soft / soft_mouth_top / **face_part(占位)**"
    b: "V2_S288版发布产物/01_整鸭打印件/原版件_原封不动/ 只有 6 个 STL：bottom_head_shell / jaw / jaw_soft / motor_support / soft_mouth_top / top_head_shell —— **没有 face_part**；docs/audit_2026-09-08/frozen_sha256.json 也没有它"
    why_it_matters: "face_part 是原版前脸（带镜头/眼睛开孔，inventory_original.json:printed_parts_original[20] 说有 10 个孔）。B7 的 1.9\" 屏 + 脸板要接的就是这个界面。它现在没有冻结基线：谁都可以换一版而不触发 hash 告警"
    resolution: "要么把 face_part.stl 收进 原版件_原封不动/ 并算 sha256，要么把它从 original_prints 里划掉、明确由 B7 的新脸板取代"
    provenance:
      - "inventory_v2.json:purchased[16]"
      - "inventory_original.json:printed_parts_original[20]"
      - "docs/audit_2026-09-08/frozen_sha256.json"
      - "comparison_original_vs_v2.md:B7"
  - id: "D-PART-02"
    what: "'原版件 4 件' 与 '冻结 6 个 STL' 的差额没说清"
    a: "inventory_v2.json:frozen_items[7] —— '原版件_原封不动/ 6 个 STL 逐字节'"
    b: "purchased[16] qty=4（要打印的原版件）"
    why_it_matters: "差的 2 个正是 bottom_head_shell 与 motor_support —— 它们冻结是为了**对照**，不是为了打印（C5）。两份数字都对，但只有读了 C5 才知道为什么不一样，机器读不出来"
    resolution: "已在 frozen.yaml:original_stl_sha256 每条加 print: true/false，并由 frozen.yaml:C5_reference_only 兜底"
    provenance:
      - "inventory_v2.json:frozen_items[7]"
      - "inventory_v2.json:purchased[16]"
      - "comparison_original_vs_v2.md:C5"

