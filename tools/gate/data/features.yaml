# 本文件由 docs/gate/inventory_v2.json + inventory_original.json + comparison_original_vs_v2.md 机械转换而来。
# 字段约定见 tools/gate/data/README.md：
#   · 每条记录必须有 provenance（duck.py:行 / s288.py:行 / ankle_split.py:行 / mechanical_audit.json:键 /
#     inventory_original.json:路径 / inventory_v2.json:路径 / MJCF:行 / comparison_original_vs_v2.md:编号）
#   · 数值字段统一写成 {v: <值>, src: measured|datasheet|assumed}
#   · 搬不过来的值写 v: null，并在同条记录里给 unknown_class + unknown_reason
# 单位：mm / mm^3 / g / N / degC，除非字段名另有后缀。不四舍五入。
# features.yaml —— 151 条特征清单（孔/沉头/槽/凸台/夹持面/让位/扫掠刀）。
# 策略：spec_verbatim 只用于**定位与追溯**，Gate 判据一律从 tolerances.yaml 的 feature_check_tolerances[kind] 取，
#      绝不把 spec_verbatim 里的世界坐标当判据（contains_world_coords 标出哪些条目含只对当前设计成立的坐标）。
# nominal_source.src 的定级规则：文本含未知/未审计/未建模/未定/未查/未测/未量/未检查 → null（必须给 unknown_reason）；
#      否则含 名义/采用/假设/占位/推断/官方图/手册/商品页/标称/待打/待试/冻结 → assumed（混合表述按最弱一环取 assumed）；
#      否则含 [量]/射线/实测/audit/检查/报告/原版/…（含从原版网格量得） → measured；都不含 → 保守记 assumed。


# ── 2026-09-09 新增：承力薄筋（kind: rib）────────────────────────────────────
# 起因：tolerances.yaml:load.min_section_and_rib.max_rib_slenderness.refused_2026-09-09 说得很准 ——
# 「层里根本没有量筋的代码」而且「data 里也没有任何一条筋的长/厚」。全仓库只有一句散文：
# 「H02 沉孔窄筋射线厚度 1.434mm，替代原 0.444mm 薄筋；新增 L07 后鞋底最薄约 1.763mm」
# （V2_S288版发布产物/01_整鸭打印件/打印清单与参数.md:61「打印参数与薄处」）。
# 本轮把这两处建成特征，并用 trimesh 在**导出 STL（export_local）**上现场量出来。
#
# 探针 geom.rib_probe 是**给层用的机器可读量法**，两种模式，层（l7_mass.py:_ribs）按字段选：
#   模式 A（run_scan）：origin_mm + thickness_axis + run_axis + run_span_mm + grid_step_mm
#       逐个采样点沿 thickness_axis 打一条射线，取**第一段实体**的长度作局部厚度；
#       厚度 = 采样区间里的最小值；长度 = 含 origin 的那一段"厚度等于最小值（差 ≤ thickness_equal_tol_mm）"
#       的连续区间的跨度。两个判据都是**存在性 / 数值相等**，不含任何工程阈值。
#   模式 B（region_scan）：region_bbox_mm + thickness_axis + grid_step_mm
#       在矩形域上按网格沿 thickness_axis 打射线，取实体总厚的最小值。只给厚度，**不给长度**。
# 一句话：part-specific 的坐标全在这里，规则里只有"怎么量"。（此块原在 features 列表中段，09-12 重写文件时移到头部）
schema_version: 1
frames:
  _why: 原来的 datum_frame 只有 world_verbatim / part_local / servo_frame 三个字符串，和导出 STL 的坐标系没有任何对应关系 —— 所以第 2 层读不懂 spec_verbatim
    里的坐标（实测两例：N03 discB 声明世界 x 40.4..44.1，导出件里是 x 14.4..18.1；L07 的 6700 座声明沿舵机 x，导出件里沿 z）。本节给出三种旧取值到 export_local
    的确定变换，features[*].geom 里的 pos/axis/bbox 已经**全部改写成 export_local**，不再需要读者自己换算。
  export_local:
    definition: 导出 STL 自己的坐标系 = MJCF 连杆坐标系。checks.py:17-19 export(m,name,body) 先做 to_local(m,body) = placed(m, inv(TW(body)))，再写盘。所以
      p_export_local = inv(TW(body)) · p_world，TW(body)=B[body]['T_world'] 由 kin.py 从 upstream/microduck_rl/.../robot_walk.xml
      解析（单位 mm）。
    unit: mm
    note: 17 个件的 TW 旋转全都是带符号的置换矩阵（元素只有 0/±1），所以世界轴对齐的方块在 export_local 里**仍然是轴对齐方块**，bbox 可以逐角点变换后取 min/max，不会失真。
  datum_frame_mapping:
    world_verbatim: spec_verbatim 里的数就是**世界坐标（零位姿）**。变换：p_export_local = inv(TW(body)) · p_world。
    part_local: 历史遗留标签，**并不表示件的自身坐标系**：inventory 里这一类条目的数字有的是世界坐标、有的是舵机局部坐标。geom.frame_note 逐条写明这条到底原本是哪一种。
    servo_frame: s288.py 的舵机局部系：输出轴沿 +x、法兰面朝 +x，长边沿 z（顶端 z=+9.5），宽 20 沿 y。变换：p_export_local = inv(TW(body)) · R_servo
      · p_servo，R_servo 见下面 servo_frames。
