      - 97.2
      src: measured
      src_note: 09-12 第二批：lib.servo_slide(sfw('yaw2roll',0)) 实体（体积 47129.6 mm³）8 角点经 frames.per_part.L01 变到 export_local
        取 AABB；世界 bbox [[-7.05,7.3,17.8],[19.05,27.7,112.2]]。盒是扫掠体外包，只多算禁撑区不少算
    zone_shape: box_hull_of_sweep
    zone_tiering_note: 09-13 C-4：box_export_local 是口袋+60 mm 走廊的整个外包，口袋里有支撑是正常的（拆掉就行）→ printability.yaml:no_support_zones
      按 kind=slide_corridor 归 removable；真正怕支撑疤的是口袋内壁的舵机定位面，另按下面 mating_shells_export_local 逐面声明 0.5 mm 壳层（一律 forbid，l1_printable.no_support_zone_set）。
    mating_shells_derivation: '口袋 = legs.py:build_yaw2roll 里 servo_env(Rs) 挖出的 s288.servo_envelope（舵机本体 + 单边 S.clr=0.3）的六个轴对齐面，

      背板 = back_shell(Rs, 3.0)（等厚 3 mm，贴着背面台阶），螺丝只用上排 2 孔 mnt_cut2(Rs, pairs=(0,))。

      面 → export_local：p_e = frames.per_part.L01.world_to_export_local_R · (sfw(''yaw2roll'',0) · p_servo) + t（置换阵，面仍轴对齐）。

      每个面按 0.5 mm 网格采样、点取在面外 0.5 mm 处，用 trimesh.contains 对 cad/duck_s288/L01_yaw2roll.stl（build #7）判该处有没有壁；

      有壁区的 AABB × 向口袋内 0.5 mm = 壳层（material_frac = 该 AABB 里有壁采样点占比）。

      0.5 的理由：切片实参 --support-material-contact-distance 0.2 + 一层支撑界面 0.2 = 0.4 → 落在面外 0.5 以内的支撑挤出线，

      其疤就留在这个面上；而滑配间隙只有 servo_slide 0.2 / envelope 0.3，疤 ≥ 间隙即卡死。

      不声明的面：法兰侧（舵机 +x，无壁：采样 3% 只是顶端壁的转角）；背面斜坡段（舵机 z −1.3..2.3，非轴对齐，**未定**）；

      接线端（舵机 −z = 滑入口，按 servo_slide 构造无壁，采样 0%）。走廊方向：世界 −z = export_local +z = 舵机 −z。

      '
    mating_shells_export_local:
    - face: 背板内面·薄段（舵机系 x=-10.25，法向 -x）
      role: 螺丝压紧的贴合面（上排 2×M2 把薄段背面拉到 back_shell 上）
