# 本文件由 docs/gate/inventory_v2.json + inventory_original.json + comparison_original_vs_v2.md 机械转换而来。
# 字段约定见 tools/gate/data/README.md：
#   · 每条记录必须有 provenance（duck.py:行 / s288.py:行 / ankle_split.py:行 / mechanical_audit.json:键 /
#     inventory_original.json:路径 / inventory_v2.json:路径 / MJCF:行 / comparison_original_vs_v2.md:编号）
#   · 数值字段统一写成 {v: <值>, src: measured|datasheet|assumed}
#   · 搬不过来的值写 v: null，并在同条记录里给 unknown_class + unknown_reason
# 单位：mm / mm^3 / g / N / degC，除非字段名另有后缀。不四舍五入。
# waivers.yaml —— 豁免。**现在是空的，没有预先豁免任何东西。**
# 只有 WARN 可豁免；豁免绑定输入 hash，输入一变自动失效（元规则 7 / 9）。

schema_version: 1
policy:
  waivable_severity:
    - "WARN"
  not_waivable:
    - "BLOCK"
  note: "只有 WARN 可豁免（元规则 9）。豁免绑定输入 hash：任何一个绑定的 hash 变了，这条豁免自动失效，格子变回红/灰。"
  provenance:
    - "tools/gate/README.md 元规则 9"
    - "tools/gate/README.md 元规则 6"
    - "tools/gate/README.md 元规则 7"
schema:
  cell_id: "**必须精确到判据**：<件号>.<层号>.<检查名>（例 H02.5.pla_self_tap_engagement）或 L<层>/<件号>:<检查名>（例 L5/H02:pla_self_tap_engagement）。只写到格子（H02.5 / L5/H02）的豁免会被 core.apply_waivers 拒绝并记进 waiver_notes —— 那会把该格全部 WARN 判据一起放行（审计 2026-09-13 F-核-4）。"
  layer: "0–7，必须与 cell_id 里的层号一致"
  severity: "只能是 WARN"
  reason: "为什么可以放行 —— 要写清楚'风险由什么承担'，不是'看起来没事'"
  issued_by: "签发人（真名或 git 用户名）"
  date: "YYYY-MM-DD"
  bound_input_hashes: "**映射 {仓库相对路径: sha256}**，键与 scorecard.json:source_manifest 同一口径（例 'duckstructure/s288.py'、'cad/duck_s288/L01_yaw2roll.stl'、'tools/gate/data/tolerances.yaml'）。至少绑定：该件导出 STL、duckstructure/*.py、12 个 data/*.yaml。任何一个键的 sha256 与当前 manifest 不同，或键不在 manifest 里，豁免自动失效。2026-09-13 之前这里写的 duck_py_sha256/stl_sha256:{件号} 那套嵌套键永远匹配不上 manifest，按旧文档写的豁免从来没生效过。"
  expires_when: "失效条件（自然语言 + 可判定条件），例如 'TC01 试件打完并回填 fits.pla.bearing_outer_seat_6704' 或 'bench.yaml:BN09 打勾'"
  linked_bench: "可选：如果这条豁免是'先放行、到货实测'，填 bench.yaml 的验证项 id"
example_non_binding:
  _warning: "**这只是格式示例，不是生效的豁免。** 它在 example_non_binding 里，不在 waivers 列表里，Gate 不读它。"
  cell_id: "L5/<件号>:<检查名>"
  layer: 5
  severity: "WARN"
  reason: "<为什么可以放行，风险由谁/什么承担>"
  issued_by: "<签发人>"
  date: "<YYYY-MM-DD>"
  bound_input_hashes:
    "cad/duck_s288/<件号>_<名>.stl": "<64 hex>"
    "duckstructure/s288.py": "<64 hex>"
    "tools/gate/data/tolerances.yaml": "<64 hex>"
  expires_when: "<可判定的失效条件>"
  linked_bench: null
# ── 生效豁免（2026-09-14，Gate 数据同步到 r3 件时签发）─────────────────────────
# 两条都来自 2026-09-14 第三轮对抗复审（r3）：一条是 L01 偏航端毂的径向韧带，一条是 H01 右前脚起子槽。
# 两条都**不改几何**：CHANGELOG「2026-09-14 复审修复 r3」第 3 条（豁免）与第 2 条（修到唯一交点）。
waivers:
  - cell_id: "L2/L01:L01-F04:wall"
    layer: 2
    severity: "WARN"
    criterion_waived: "孔周最小壁厚 ≥ 2.5（fits.pla.min_wall）。本件这 6 个孔的壁厚判据在几何上不可能满足：孔开在 Ø14.85 的 6702 内圈毂上，毂半径 7.425 一共就那么多料。复审用的实际判据是『径向韧带 ≥1.2』，实测 0.968 也不过 —— 本条豁免针对的就是这个 0.968，不是把 min_wall 2.5 在别处也放行。"
    measured_mm:
      hub_web_ligament: 0.968
      hub_web_ligament_nominal: 0.975
      hub_web_ligament_how: "径向射线，左右件 × x 13.3..16.8 八站位 × 6 孔，取最小（tools/cad/mechanical_audit.py:_review_r3 c，断言 ≥0.9）"
      nominal_derivation: "毂 Ø14.85/2 = 7.425 − (horn_r 5.25 + horn_hole_d 2.4/2) = 0.975"
      cbore_layer_breakout_depth: 0.025
      cbore_layer_breakout_width: 0.82
      cbore_layer_how: "沉窝层 x 17.0..17.5：Ø4.4 头窝外缘 r 7.45 > 该层毂外圆 7.4125 → 6 处各破出 0.025 深 × 0.82 宽的豁口"
    reason: "① 这 6 个是**过孔不是攻牙孔**：M2 拧进的是舵机法兰上的金属攻牙孔，螺丝预紧后过孔壁不受拉，不产生径向胀力，韧带不是被撑开的那一层。② 毂外圆对 6702 是**间隙配合不是压装**：6702 内孔 Ø15 对毂 Ø14.85 是 0.075 单边间隙（lib.P['brg_yaw']['hub_d'] 就是按 15−0.15 定的），装配时不靠毂胀紧内圈。③ 扭矩的剪切路径走的是**周向腹板 3.10**（孔与孔之间那圈料），不过这道径向韧带 —— 径向韧带断了关节也不会失扭。④ 三个上游尺寸都不许动：毂 OD 由 6702 内径 15 定死、过孔 Ø2.4 是 09-13 用户按 TC02 孔规定案（Ø2.2 打出来只有 1.90，M2 穿不过）、分度圆 5.25 是手册 Ø10.50 + 09-13 实物定案；毂 x 13.0..17.0 整段都是内圈区，没有『轴承不套的 x 段』可以加厚。⑤ 打印后竖直小孔缩 0.15/边，实物韧带 ≈1.1。**另附**：沉窝层（x 17.0..17.5）Ø4.4 头窝外缘 r 7.45 已经超出该层毂外圆 7.4125，6 处各破出 0.025 深 × 0.82 宽的豁口 —— 这 6 个豁口落在**轴承座区之外**（轴承坐 x 13.0..17.0，沉窝层在它上面），M2 螺丝头外缘 r 7.25 仍然全部落在毂料上，头的承压面不缺角，该处非承力。"
    issued_by: "owner"
    date: "2026-09-14"
    bound_input_hashes:
