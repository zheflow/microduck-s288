      how: "真圆值为几何解析值（2026-09-14 用户给定）；64 边值是 mechanical_audit 在导出网格上实测的（0.149817 = 0.15·cos(π/64)，正是『64 边刀对同相位 64 边槽』这一项差出来的 0.0027）。5 条不碰脚的刀路余量 1.94..2.00 不受影响。"
    reason: "差的 0.0027 是**网格离散差，不是几何差**：判据算的是 64 边内接多边形刀对同相位 64 边槽，同相位时两组多边形的平边相对，量到的是 0.15·cos(π/64) = 0.149817；真圆对真圆就是 0.15，本次真圆解析值 0.1473 也只差 0.0027。更重要的是：**这两个数是同一把刀的两端**——槽做大一点，起子余量涨、孔壁减；槽做小一点，孔壁涨、起子余量减。Ø4.3 时起子余量只剩 0.048（r3 的 MAJOR），Ø4.5 时起子余量 0.1473、孔壁 1.2034，两条判据（0.15 / 1.2）已经把它夹在**唯一一个交点**上，再往任何一边动都会让另一条穿底。所以：**Ø4.5 与分度圆站位（horn_r 5.25 决定的 6 条刀路位置）都不许再动。** 承压圈本身非主承力（H01→H03 的 4 颗 M2×8 自攻靠的是脚厚 1.70 的整片脚盘，不是圈内那 1.2 的孔壁），复审 review_r1 e 的『4 个最薄壁 ≥1.2』仍 PASS。"
