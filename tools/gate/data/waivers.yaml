    layer: 5
    severity: "WARN"
    gate_cell_note: "**Gate 目前没有这个格子**：H01 右前脚的 6 条 Ø4.5 起子槽在 features.yaml 里没有独立特征条目（最近的是 H01-F08 tool_channel，描述的是 Ø4.6 大通道 + Ø6.4×1.7 承压圈回填，不是这 6 条槽）。判据现在只活在 tools/cad/mechanical_audit.py:365-372（N03 tool corridors：∩ ≤0.05 且 H01/H02 min_gap ≥ 0.15·cos(π/64)−1e-4）。本条先按 waivers.yaml 的 schema 记在案，等 features.yaml 补出该特征、L2/L5 长出对应判据后把 cell_id 指过去。"
    criterion_waived: "N03 A 端 6 颗 Ø4.2×45 起子刀路对 H01 的 min_gap ≥ 0.15，同时右前脚承压圈孔壁到削面 ≥ 1.2。两条同时卡在边界上。"
