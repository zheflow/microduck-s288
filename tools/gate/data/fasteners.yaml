# 本文件由 docs/gate/inventory_v2.json + inventory_original.json + comparison_original_vs_v2.md 机械转换而来。
# 字段约定见 tools/gate/data/README.md：
#   · 每条记录必须有 provenance（duck.py:行 / s288.py:行 / ankle_split.py:行 / mechanical_audit.json:键 /
#     inventory_original.json:路径 / inventory_v2.json:路径 / MJCF:行 / comparison_original_vs_v2.md:编号）
#   · 数值字段统一写成 {v: <值>, src: measured|datasheet|assumed}
#   · 搬不过来的值写 v: null，并在同条记录里给 unknown_class + unknown_reason
# 单位：mm / mm^3 / g / N / degC，除非字段名另有后缀。不四舍五入。
# fasteners.yaml —— 31 组 / 163 颗。每颗螺丝写**自己的** tool_envelope（Ø4.2 / Ø4.6 / Ø15 内腔 / PH0…），
#      不设全局 Ø5；channel_d_mm 为 null 的表示清单里没有这个数，第 4 层对它判 BLOCK（元规则 4 未知=失败）。
# 咬入阈值不写在这里，按 joint_type 去 tolerances.yaml:engagement_by_joint_type 取范围。
# 2026-09-09 tool_envelope 补齐：每组多了 drive_type / bit_d_mm / shaft_len_mm 三个字段，仍然**逐组各写各的**，
#   本文件没有、也不许有全局默认值。三者的含义与既有的 channel_* 严格区分：
#     bit_d_mm     起子**批杆**最大外径（PH0 取 Ø4.0；F17/F24 按设计里已声明的 Ø4.2 / Ø4.0 长杆取）
#     shaft_len_mm 从螺丝头承压面到起子握柄所需的**最小杆长**，下界 = 第 4 层 _reach_to_outside 量出的
#                  『螺丝头 → 整机包围盒之外』距离（本轮用 ./.venv/bin/python 在 placed/ 上重跑，向上取整 0.1）

#     channel_d_mm / channel_len_mm 是**通道**（沉坑 / 铣面 / 内腔）的直径与长度，不是批头。
#       已有声明的 Ø4.6 / Ø13.8 / Ø15 / Ø4.2 全部原值保留并标 kind: declared_access_channel；
#       原来是 null 的那些按本组自己的 bit_d_mm / shaft_len_mm 补上，标 kind: required_tool_channel，
#       旧的 null 与旧 unknown_reason 保留在 was_v / was_unknown_class / was_unknown_reason。
#   量不出 reach 的（孔坐标落在整机包围盒面上、drive_direction 自相矛盾、扎带/卡扣/未建模）一律留 null，
#   并把 unknown_reason 换成本轮查清楚的真原因 —— 第 4 层会把这段理由原样打进记分卡。
# N01 / N03 两条已确认问题见 F11b_neckpitch_back_lower 与 F15_headyaw_back 的 issue 段。
# 09-12 第二批：tool_access（真坐面/头侧方向/拧紧工位）由 tools/gate/probe_seats.py 在导出实体上量出后写入；
#   available_shaft_len_mm（实物起子可用杆长）是实物未知，不编；tool_reach_declared 保持 unknown，需要的杆长下界在记分卡里。
# 2026-09-15 长度口径：本文件所有 spec "M2×L" 的 L = 帽底到尖（盘头标准），engagement = L − stack（− 垫圈）。
# 实物教训：用户手上"M2×10 自攻"总长 9.8 / 帽底到尖 ≈8.4（卖家按总长标），装 TB02 摆臂只露 0.9 mm 无牙锥尖 → 拧不进；
# 采购按帽底到尖核对（03_采购/采购清单.md 第一行），自攻进 Ø1.7 光孔前先开牙（assembly.yaml:pre_assembly_2026-09-15）。
