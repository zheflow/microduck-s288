discrepancies:
- id: D-FAST-01
  what: '''进 S288 的 116 颗''与 fasteners 表逐条相加的 128 颗对不上'
  a: inventory_v2.md 第 3 节：'咬入状态（进 S288 的 **116** 颗）：ok **112**；F11b 2 颗；F15 2 颗'（112+2+2=116，md 自洽）
  b: inventory_v2.json:fasteners 里 engages == 'S288 金属螺纹' 的 19 组逐条相加 = **128**（背孔 44 = F01 4 + F03 4 + F05 8 + F07 8 + F09 8 + F11 2 + F11b 2 + F13 2 + F15 4 + F18 2；法兰 84 = F02/F04/F06/F08/F10 各 12 + F12/F14/F16/F17
    各 6）
  delta: 12
  why_it_matters: 第 5 层要对'每一颗进金属螺纹的螺丝'查咬入。按 116 跑会漏掉 12 颗，而且不知道漏的是哪 12 颗
  resolution: 以 JSON 的 128 为准（逐条可核）；md 的 116/112 需要作者说明是怎么算的
  provenance:
  - inventory_v2.md 第 3 节
  - inventory_v2.json:fasteners
- id: D-FAST-02
  what: 总数 157 里'停用 1'的算法
  a: inventory_v2.md 第 3 节把 '停用 1' 列进按规格的分项里
  b: inventory_v2.json:fasteners[22] F21b_B01_rear_disabled 的 qty = **0**
  why_it_matters: 按 JSON 相加（停用=0）正好 157 颗螺丝 + 2 扎带 + 2 卡珠 = 161 件紧固件，与 counts.screws_total=157 对得上；md 那个 '1' 指的是'1 组'不是'1 颗'
  resolution: 本文件 counts 同时给 screws_total(157) 与 sum_of_qty(161)，并让 F21b 保持 qty 0 / status disabled
  provenance:
  - inventory_v2.md 第 3 节
  - inventory_v2.json:fasteners[22]
  - inventory_v2.json:counts.screws_total
- id: D-FAST-03
  what: 原版侧完全没有螺丝清单可对照
