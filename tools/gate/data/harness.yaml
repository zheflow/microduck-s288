    connector_gender_2026-09-22: "**公母定案（2026-09-22 用户发实物照片确认，此前已多次口述告知）：宇树转接板上的两个 XT30 板载直角座——主输入口与扩展口——两边都是公头（针）；照片里黑色座内两颗金针清晰可见，旁边是 PH2.0 3 针白座与 USB-C 口。**因此插上去的线/模块一律母头（洞）：过颈到主输入 = XT30U-F 母头单头线 30 cm（购物车已有）；UBEC 输入 = **母头 XT30U-F**（下单让卖家焊；科亿航模客服答『公头』是按通用规矩——公头=取电端——他假设插电池，不适用于我们插扩展口）。通用规矩仅供理解：母头=送电端、公头=取电端，带电端做成洞防短路。**2026-09-22 结案**：用户看实物确认**电池就是母头（两个洞）**，原写『公』作废。全链公母因此闭合：电池母 ← 公头10cm线 → 开关 → 母头30cm线 → 转接板主输入(公针) → 扩展口(公针) ← UBEC 母头。购物车两根 XT30 单头线的公母都买对了。**不要再问用户转接板或电池的公母。**"
