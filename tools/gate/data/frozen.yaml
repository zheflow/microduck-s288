capability_envelope:
  pose_steps_source:
    path: "tools/gate/out/policy_steps_2026-09-16/policy_steps.npz"
    sha256: "14ab179745eb426f997cf8e2b2eb7f7164f12c2896e3540f89a74df8967e3594"
    provenance: "09-17 独立复核：用户指定的原版7任务逐步记录，14轴、41337 prefall样本；更换来源必须显式更新本声明并重跑，不许由summary自选来源。"
  # 2026-09-16 用户定：**能力必须与原版一致；转角/CAD/大小可以不同**。所以 joint_axes[].target_range_deg 不再按我们的件
  # 能转多少来填（09-15 那次按件收窄到 62/62/44.5 = 判据迁就件，失去约束力），而是从原版策略**实际用到**的关节角推导：
  #   target_range_deg.v = clip( ∪_{mode∈modes_in_scope} key[mode][joint] ± margin_deg , 上游 MJCF range )
  # 数字只来自 source 文件 + 上游 XML，由 derived_by 脚本写入；改件不改判据，换包络文件（重训后重导）再跑一次脚本。
  # 第 6 层：碰撞落在 target 内 = BLOCK（件的问题，能力受损）；落在 target 外但仍在上游 range 内 = WARN（工作空间比原版窄，
  # 原版任务用不到）；另判 _capability/*：每个 in-scope mode 的包络 ± margin ⊆ 本层量出的无碰撞区间。
  source: "docs/workspace_2026-09-09/policy_envelope.json"
  source_note: "原版策略（XL330 动力学、原版 XML）逐 mode 跑出来的关节角统计；policy_envelope[mode][joint].all.actual_deg = 实际走到的 min/max。09-09 生成，不含 S288 数据"
  key: "all.actual_deg"
  modes_in_scope:
    - alpha_walking
    - alpha_stand
    - alpha_sitstand
    - alpha_ground_pick
    - ball_kick_left
    - ball_kick_right
    - roulade
  modes_out_of_scope:
    roller: "轮滑脚硬件选配（换轮子脚），默认不在能力清单；用户要就加进 modes_in_scope"
    roller_crouch: "同上"
  margin_deg: 3.0
  margin_note: "包络两端各留 3°：与 09-15 收窄时的安全边口径一致；重训策略可能走得略远，边不够就重训后重导包络再推导"
  # 左右腿是镜像件（同一 build 函数 + mirror），关节符号左右相反（joint_axes[].home_rad / range_deg 左右取负；上游 mdp.py
  # 注释"mirrored L/R sign conventions"）。原版策略左右并不对称（起立主要用右腿：right_knee 到 −83.1、left_knee 只到 75.1），
  # 但"能力"不分左右——原版用右腿能做的动作，我们的鸭子用左腿做也算同一能力，且镜像件只能对称地切。
  # 所以先把左右包络按符号镜像求并，再各留边、夹上游 range。
  mirror_symmetric: true
  mirror_pairs:
    - [left_hip_yaw, right_hip_yaw, -1]
    - [left_hip_roll, right_hip_roll, -1]
    - [left_hip_pitch, right_hip_pitch, -1]
    - [left_knee, right_knee, -1]
    - [left_ankle, right_ankle, -1]
  mirror_note: "sign=-1：右 = −左。证据：frozen.yaml joint_axes[].home_rad（hip_roll ∓0.0873、hip_pitch ∓0.4579、knee ∓0.0049、ankle ±0.453）与 range_deg（hip_yaw 左 [-25,30] 右 [-30,25]）"
  derived_by: "tools/gate/derive_target_ranges.py"
  date: "2026-09-16"
  decided_by: "用户 2026-09-16：『转角、CAD、大小什么的都可以不一样，反正都要重新训练了，但是能力一定要一样』"
joint_axes_rule:
