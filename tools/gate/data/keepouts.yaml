      note_2026-09-23_hr39c: hr39c 嘴舵机挪到新嘴轴 (31.75, y, 245.5)、ψ 5°、法兰面 y 47.75（jaw.JAW_CONN_MODE 两口 free）：插座都在舵机背面 y 21.75，局部 +y ≈ 世界 −z 下口（插头顶面中心 (41.69, 21.75, 238.59)）、局部 −y ≈ 世界 +z 上口 (40.34, 21.75, 254.03)（duckstructure/wiring_head.JAW_PLUG）；离那摞件真实姿态 2.89 / 2.41、线 2.89 / 2.33（jaw_verify）。进下口（S1 腿① → 转接块 → PH2.0 双头 10 cm），出上口 → 嘴原配 200 扁线 → 8 下口；嘴在头链中间，一分二回到 5 根（harness.yaml:HB01）
