# 字段约定见 tools/gate/data/README.md：
#   · 每条记录必须有 provenance（duck.py:行 / s288.py:行 / ankle_split.py:行 / mechanical_audit.json:键 /
#     inventory_original.json:路径 / inventory_v2.json:路径 / MJCF:行 / comparison_original_vs_v2.md:编号）
#   · 数值字段统一写成 {v: <值>, src: measured|datasheet|assumed}
#   · 搬不过来的值写 v: null，并在同条记录里给 unknown_class + unknown_reason
# 单位：mm / mm^3 / g / N / degC，除非字段名另有后缀。不四舍五入。
# keepouts.yaml —— 21 个禁入体（视锥 / 声孔 / 摆动扇区 / 电池抽出 / 接口 / 刀路 / 线束空间）。
# 第 3 层把它们当实体做交集；第 4/6 层把它们当扫掠障碍。
# status=unchecked 的 9 条现在没有任何工具在查 —— 建 Gate 的第一批活就在这里。

# ── KO01 2026-09-21：线翘 wire_out 2.0 → 4.0（用户实物：原配线硬，出插头先直立 ≈4 再弯）+ wire_clr 0.4 → A 区到 x −17.4；3 mm 背板兜不住 → pocket 型作废，
#    踝/颈俯仰/头俯仰全改 window（踝后口、颈俯仰 −y 口 none），L07/N02 脸颊/T03 壳各减线翘区扫掠让位（记录第 31–32 条）。W（通窗）只对载体查。
# ── KO01 2026-09-20：插座模型改为**背插**（用户实物照片：座在背面接线端两角、插头沿 x 背插、插到底与 23 面齐平、线再凸 ~2）。下面 09-11 的
#    侧插说明与可用性表全部作废，只留作历史；新实体 A/B/W 与逐颗 mode 见 KO01 本条。
# ── KO01（头横滚舵机 PH2.0 插座）历史说明，原在该条记录中段，09-12 重写文件时移到头部 ──
#   2026-09-11：geom 改成厂家尺寸图反推的实测值。旧 geom『6×6×11 方块 @ y=±13, z −16.5..−5.5』**是错的**：
#     x 中心取 0（跨 −3..+3），而真实插座壳体在 x −10.0..−3.4 —— 两者只在 x=−3 擦边；z 上沿也少算 0.8。
#     历史 mm³（L03 65/66、N03 71/215、H01 165/205）全是拿这个偏了 ~6.6 mm 的方块算的。
#     注意：插座**不外凸**（向机身内凹 4.8），外凸的是插上去的 PHR-3（2.0）。
#   2026-09-11：两侧可用性逐颗量过（零位姿，离线）。判据：该侧沿 ±y 直线净空 ≥ 6.85 **且** 插合态（外露 2.0）无干涉。
#     用 PHR-3 真实截面 7.8×4.5 与留 0.5 间隙的 8.8×5.5 各算一遍，判定完全一致。
#     复现：./.venv/bin/python /tmp/ko01_plug.py（逐 mm 推进求净空）/ ko01_mated.py（插合态）/ ko01_depth.py（阻挡深度剖面）
#   下一轮改 CAD 的人照着做（那轮一个字节没动 duckstructure/）。每条：改哪个文件哪一行、加什么刀、代价、复核层。
# ── 09-12 第二批：与 keepouts 对表的 CAD 通道刀名义外加 0.05（lib.cyl 64 边内接 vs l3_static._cyl 128 边外接），见 neck.NP_KO_OVER / head.KO_OVER ──
