items:
  - id: "BN01"
    title: "螺丝预紧变形与摩擦（S288 **塑料自攻** + PLA 坐面）"
    title_was_until_2026-09-10: "『S288 金属螺纹 + PLA 坐面』——**口径错**。S288 是塑料齿轮 + 塑料壳（宇树 2026-09-08 官方参数表，用户实物确认），壳上没有任何金属内螺纹；M2 内螺纹是 J288 的规定。理由与后果见 tolerances.yaml:engagement_by_joint_type.s288_plastic_self_tap.why_replaced_s288_metal_thread。"
    why_not_offline: "预紧扭矩→塑料塑性塌陷→有效咬入衰减，是材料时间相关行为，几何算不出来。**塑料自攻还多一层**：牙是螺丝自己攻出来的，每拆一次都可能不对牙、把牙削平 —— 这个衰减既不是几何量也不是弹性量。"
    criterion:
      - "装配扭矩 0.20 N·m 拧到位后，PLA 坐面塌陷 ≤0.10 mm"
      - "**测出塑料自攻的可接受咬入下限**（不是拿一个已有阈值去比）：同一颗螺丝在舵机塑料壳的 Ø1.7 光孔里重复拆装 5 次，每次记录拧入扭矩峰值与轴向拔出力，给出『拔出力衰减到初次的 70% 时对应的咬入』"
      - "拧紧后 24 h 静置，扭矩衰减 ≤30%"
      - "两种牙型各拧一颗做对比：PT 型（挤压式三角牙）vs 尖头切削自攻 —— 回答 tolerances.yaml:engagement_by_joint_type.s288_plastic_self_tap.thread_form_guidance.falsified_by"
      - "记录『同一个孔拧到第几次开始明显滑牙』→ 回填 fasteners.yaml 各组 max_reinsertions（现在 27 组全是 null）"
    criterion_changed_2026-09-10: "原第 2 条 criterion 是『同一颗螺丝重复拆装 5 次后，咬入仍 ≥1.8 mm（tolerances.yaml:engagement.s288_metal_thread 下限）』。两处错：① 1.8 是**金属内螺纹**的下限，对塑料自攻无效（S288 是塑料齿轮塑料壳）；② 那个路径 `engagement.s288_metal_thread` 在 tolerances.yaml 里**根本解析不到**（实际路径是 engagement_by_joint_type.*）—— 也就是说这条 criterion 引用的阈值从来就取不到，它是一句取不到数的话。现在塑料自攻桶的 range_mm 两端都是 null（unknown_class: not_measured），本条的角色从『拿阈值验收』变成**『生产这个阈值』**。"
    backfill_to:
      - "tolerances.yaml:engagement_by_joint_type.s288_plastic_self_tap.range_mm.min（null → 实测下限，并删掉 unknown_class）"
      - "tolerances.yaml:engagement_by_joint_type.s288_plastic_self_tap.thread_form_guidance（候选 → 结论）"
      - "fasteners.yaml:<27 组>.max_reinsertions（null → 实测次数）"
      - "fasteners.yaml:<19 组>.screw_type.thread_form.v（null → 牙型）"
    blocks_what: "在 range_mm 两端都是 null 的时候，第 5 层对这 19 组 128 颗的 `engagement` 判 unknown（= 红）—— **实跑核实过：19/19 全红，红的理由原样打的就是 s288_plastic_self_tap.unknown_reason**（gate.py --layers 5 记分卡 L5/F01…F18+F11b）。注意这 19 组**只有 `engagement` 这一条**；`engagement_declared` / `engagement_derived` / `engagement_per_hole` 各 9 条全部落在 pla_self_tap 那 8 组上，s288 组一条都没有（同样是实跑数出来的，不是推的）。**这些红是数据缺失造成的，不是件做错了** —— 修件修不掉它们，只有本条能。"
    value_status: "proposed"
    checked: false
    result: null
    depends_on_arrival:
      - "S288 到货"
    provenance:
      - "tools/gate/README.md 第 2 节 不进 Gate 清单"
      - "tolerances.yaml:engagement_by_joint_type.s288_plastic_self_tap"
      - "docs/reference/s288/给宇树客服的问题清单_2026-09-10.md:47（第 5 问：牙型 / 拧入扭矩上限 / 可反复拆装次数，未回）"
      - "V2_S288版发布产物/04_电机到货测试/S288实测尺寸记录.md:56（塑料齿轮、塑料壳）"
  - id: "BN02"
    title: "多舵机峰值电流与母线压降"
    regen_note_2026-09-17: "宇树文档页（About_J288-S288『制动工况下的母线过压风险』）：快速换向/位置阶跃/急减速时电机把机械能回馈母线，电源吸收不了母线就抬升，且手册没给 S288 的过压触发值、不能依赖保护。我们是 3S 电池直通 XT30(2+2)——**电池 + 保护板必须允许接收回馈电流**（battery_3s 的 BMS/保护板规格待查；纯裸 3S 无保护板则天然能吸收）。本项测试时同时录母线电压**上冲**（不只是压降）：14 颗同时急停 / roulade 翻身回放，示波器或转接板回报电压看峰值 ≤12.6 V。超了 → 母线并电解电容（按回馈能量选）或轨迹限幅。"
    why_not_offline: "取决于实际负载、电池内阻、线径与接头电阻，纯几何模型给不出"
    criterion:
      - "整鸭 14 颗保持站立姿态 30 s：母线电流 ≤7.5 A（清单估 4.5~7.5 A）"
      - "峰值瞬间母线电压不低于 11.1 V（3S × 3.7 V），即从 12.6 V 起压降 ≤1.5 V"
      - "XT30 + 18AWG 主干接头温升 ≤20 K"
      - "65 W GaN（12 V/3 A = 36 W）明确**只用于单舵机测试台**，整鸭必须用电池 —— 到货复核这条不被违反"
    value_status: "proposed"
    checked: false
    result: null
    depends_on_arrival:
      - "S288 到货"
      - "电池到货"
    provenance:
      - "comparison_original_vs_v2.md:B8"
      - "inventory_v2.json:purchased[3]"
      - "harness.yaml:HB03_xt30_12v_main"
