  - id: "BN16"
    title: "S288 管脚顺序实测（万用表量官方转接板）—— **上电之前必须做完**"
    why_not_offline: "两份宇树官方手册第三节的管脚表是**反的**（A 版 ① SIGNAL ② GND ③ VCC / B 版 ① SIGNAL ② VCC ③ GND），宇树客服未答。纸面上无法判定哪一版对；接反 = VCC 灌进 GND，15 颗菊花链一次全烧。这不是『离线算不出来』，是**离线只有两个互相矛盾的答案**。"
    blocking_before_power_on: true
    blocking_note: "**注意这里的『阻塞』不是阻塞 Gate 的 8 层**（本文件头写得很清楚：checked=false 的项不阻塞 8 层）。本条阻塞的是**通电这个物理动作**。**本条是 bench.yaml 里唯一一条『不做完不许上电』的项。** BN01–BN15 里任何一条只要通电就已经违反本条的前置条件（BN13 堵转、BN02 母线电流、BN03 温升、BN04 掉线都要上电）。做本条**不需要给舵机上电**：万用表通断/二极管档量的是转接板上的铜，不是舵机。"
    procedure:
      - "1. 官方单总线串口转 USB 板**不插电、不插舵机**。万用表打通断档。"
      - "2. 找到板上的 XT30（手册第四节：XT30 主输入 + XT30(2+2) 拓展）。XT30 的正负极在连接器本体上有丝印/形状区分，先认准。"
      - "3. 量 XT30 负极 ↔ PH2.0 3P 座的 ①/②/③ 三个脚，**哪个脚导通哪个就是 GND**。"
      - "4. 量 XT30 正极 ↔ ①/②/③，导通的那个是 VCC。（如果板上串了保护器件不直通，改用二极管档或量到最近的电解电容负极/正极。）"
      - "5. 剩下那个脚就是 SIGNAL —— 但**要验证**，不能靠排除法：它应该经限流电阻通到 USB 转串口芯片（CH343）的 TX/RX，对地既不通也不通正。"
      - "6. 三个脚都确认后，**再拿一颗舵机的原装线**量：舵机端 ① 对应转接板端的哪一脚，确认线是直通不是交叉。"
      - "7. 拍照记录 PH2.0 座的**缺口方向**与 ①脚位置（PH2.0 座有防呆缺口，① 的定义取决于从哪面看，这一步不拍照后面会重新搞混）。"
    criterion:
      - "在官方转接板上量到 ①/②/③ 三个脚各自是 SIGNAL / VCC / GND 中的哪一个，三个都有明确结论（不许有一个靠排除法）"
      - "结论与 A 版、B 版手册中的**恰好一版**吻合；若两版都对不上，停下来别上电，先问宇树"
      - "舵机原装线两端直通（① 对 ①、② 对 ②、③ 对 ③），不是交叉线"
      - "PH2.0 座缺口方向与 ①脚位置有照片存档"
    backfill_to:
      - "components.yaml:servo_s288.pinout（v: null → {pin1,pin2,pin3}，src: measured）"
      - "harness.yaml:HB01_servo_bus.pin_order（v: null → 端序表，src: measured）"
    value_status: "proposed"
    checked: false
    result: null
    depends_on_arrival:
      - "S288 到货（已到）"
      - "官方单总线串口转 USB 转接板到货（已到）"
      - "万用表（**本仓库没有记录用户有没有**，这是本条唯一未确认的前置）"
    can_be_done_today: true
    can_be_done_today_note: "不需要电源、不需要负载、不需要打印件、不需要给舵机上电 —— 只需要转接板（已到）+ 一颗舵机的原装线（已到）+ **一支万用表**。万用表在不在用户手上，本仓库没有记录，这是本条唯一的未知前置。"
    what_it_does_not_answer: "**只回答『哪个脚是什么』，不回答『12 V 够不够』『能挂几颗』。** 供电是 BN02 / 客服问题清单第 4 问，通信是 BN04 / 第 6 问。"
    provenance:
      - "docs/reference/s288/manual.txt:33-39（A 版管脚表）"
      - "docs/reference/s288/给宇树客服的问题清单_2026-09-10.md:12-20（第 1 问，按卡住程度排第一）"
      - "docs/reference/s288/manual.txt:41-48（第四节 单总线串口转 USB 板接口说明，XT30 + XT30(2+2)）"
      - "V2_S288版发布产物/04_电机到货测试/s288_probe.py:135（脚本自己把线序列为排查项）"
      - "components.yaml:servo_s288.pinout"
  - id: "BN17"
    title: "S288 扭矩-转速曲线（几个转速点各测能输出的扭矩）"
    why_not_offline: "**堵转扭矩是零转速下的值，走路要的扭矩是在有转速时要的。** 无刷电机的可输出扭矩随转速下降，下降的斜率取决于反电动势常数、母线电压和驱动器的电流环上限 —— 这三样我们一个都没有可信数据（0.6 N·m 与 0.32 A × 0.554 N·m/A = 0.177 N·m 互相矛盾，见 tolerances.yaml:load.servo_rated_torque_Nm.continuous_torque_Nm.do_not_derive_from）。只有堵转值答不了『0.396 N·m 在行走转速下拿不拿得到』这个问题。"
    why_this_is_the_most_important_one: "docs/gate/选型风险_颈部S288_2026-09-09.md 第 4 节把它列成三个试验里『**新增、最重要**』的一条，理由原文：『走路要的 0.396 N·m 是在有转速时要的。只有堵转值答不了这个问题』。BN13（堵转）+ BN03（温升）合起来也只给出曲线的**两个端点**：转速 0 处一个点、某一个固定负载下的热极限一个点，中间整条曲线是空的 —— 而行走恰好全程落在中间。"
    procedure:
      - "1. 用已打好的测试台 TB01–TB03 + 官方转接板 + 12.6 V 电源（65 W GaN 只够单舵机，见 BN02 第 4 条）。"
      - "2. 舵机跑**速度模式**（或位置模式给足够大的位置差让它跑到限速），在若干目标转速点上各稳住。建议点：空载转速的 10% / 25% / 40% / 55% / 70% / 85%（空载 16.5 rad/s @12 V 是参数表值，先自己实测一遍空载转速做归一化，不要直接信 16.5）。"
      - "3. 每个转速点用**可调负载**加扭矩，直到转速掉出该点 ±5%，记下此刻的输出扭矩与母线电流。负载可以用磁滞制动器；没有的话用测试台的臂 + 电子秤做准静态点测（每点重复 3 次取中位数）。"
      - "4. 全程记录：目标转速、实际转速、输出扭矩、母线电流、母线电压、外壳温度、持续时间。"
      - "5. 每点之间让舵机**降到室温 +5 K 以内**再测下一点，否则测的是热衰减不是扭矩-转速。"
      - "6. 至少跑两颗舵机（15 颗里抽 2 颗），确认曲线不是单颗个体差异。"
    criterion:
      - "得到 ≥6 个 (转速, 可输出扭矩, 母线电流) 数据点，覆盖 0 到空载转速的 85%，每点重复 3 次、中位数与极差都记录"
      - "**行走工况点必须被曲线覆盖并达标**：在 forward 回放峰值需要的 0.396 N·m 处，曲线给出的可用转速 ≥ 该关节在回放里的实际角速度。角速度取自 docs/six_checks_2026-09-08/policy/forward.npz（观测切片 20:34 就是关节角速度，单位 rad/s，见同目录 第6项_离线验证报告.md:28）。达不到 = S288 走不了这套步态，这是**选型**结论不是标定结论。**caveat**：那条回放是 XL330 基线策略跑出来的（同报告 :63），2026-09-09 已决定重训 —— 重训后的角速度会变，所以这条判据的『需求侧』本身会动；在新策略出来之前用它只能得到『按旧步态够不够』这个下限结论"
      - "曲线在低速段外推回零转速，应与 BN13 的实测堵转扭矩在 ±15% 内吻合；差太多说明两次试验里至少有一次的臂长/标定错了"
      - "同时回答『0.32 A 是母线还是相电流』：任一点的实测母线电流若显著 >0.32 A，则 0.32 A 不是母线额定"
      - "两颗抽测样品在同一转速点的扭矩差 ≤15%"
    backfill_to:
      - "tolerances.yaml:load.servo_rated_torque_Nm.torque_speed_curve（本轮新建的空位，v: null）"
      - "重训用的 MJCF actuator forcerange / BAM 拟合的先验（docs/reference/s288/给宇树客服的问题清单_2026-09-10.md『回来之后要做的事』表里，『扭矩-转速曲线』一行的落点就是这两个）"
    value_status: "proposed"
    checked: false
    result: null
    depends_on_arrival:
      - "S288 到货（已到）"
      - "官方转接板到货（已到）"
      - "12 V 电源（已到）"
      - "测试台 TB01–TB03 打印件（已打）"
      - "BN16 管脚实测做完（**未做 → 本条不许开始**）"
    can_be_done_today: true
    can_be_done_today_note: "用户手上已经有电机 + 转接板 + 电源 + 打印好的测试台，**唯一的前置是 BN16**（管脚没确认之前不许上电）。加载方式若一时没有磁滞制动器，先用测试台臂 + 电子秤做准静态点测，点少一些也比只有堵转值强。"
    relation_to_BN13_and_BN03: "BN13 给曲线的零转速端点（并校验 0.6 N·m 是否虚标）；BN03 给某一个负载下的热极限；**BN17 给中间那条线**。三条都做完，tolerances.yaml:load.servo_rated_torque_Nm 才算有数据。任何一条单独做完都不足以解开 L7 那 14 个 joint:*.torque_criteria 红格。"
    does_not_unblock: "**不解决 continuous_torque_Nm。** 扭矩-转速曲线是『瞬时能出多少』，可持续扭矩是『长时间不过热能出多少』，后者是 BN03 的事。两个数不许互相代替（tolerances.yaml:load.servo_rated_torque_Nm.stall_torque_Nm.not_sustainable 已经写过同样的话）。"
    provenance:
      - "docs/gate/选型风险_颈部S288_2026-09-09.md 第 4 节表格第 2 行（『新增，最重要』）"
      - "docs/gate/选型风险_颈部S288_2026-09-09.md:73-76,104-110（0.396 N·m 的来源与两种电流解释）"
      - "docs/reference/s288/给宇树客服的问题清单_2026-09-10.md:34（第 3 问『有没有 S288 的扭矩-转速曲线或效率曲线』，未回）"
      - "docs/six_checks_2026-09-08/policy/第6项_离线验证报告.md:63（『持续扭矩、温升和负载下扭矩-转速曲线均未知』）"
      - "tolerances.yaml:load.servo_rated_torque_Nm"
  - id: "BN18"
    title: "S288 带侧向弯矩的库仑摩擦（髋横滚取消副轴承后，输出轴单独承受弯矩时摩擦是否随负载上升）"
    added: "2026-09-17"
    why_not_offline: "裸舵机 BAM m1 的 friction_base 不能直接当作装配后关节的摩擦，也不给出S288径向额定。侧向弯矩、装配预紧、温度、方向和速度都可能改变起动/运行摩擦；拟合未改善不等于该效应不存在。当前727.7 g质量模型给出髋横滚静态280.0/脚边394.3 N·mm（docs/design_2026-09-17_support/loadcheck.log），是含采用值的设计工况，不是台架许可载荷，不覆盖冲击；测试前依据实际载荷与可追溯额定制定加载范围。"
    procedure:
      - "1. 先定义并记录夹具载荷路径、力臂、固定方式、防坠、传感器校准及停止条件。把侧向弯矩加载与驱动轴切向力矩测量解耦；从低载开始。未经许可范围核验，不按模型的最大弯矩直接加重，也不自动通电。"
      - "2. 同一颗舵机做裸机、当前单侧支撑、候选副支撑的配对测试，控制预紧、温度、转速与供电；独立测量驱动力矩，记录正反向缓慢加矩刚开始运动的起动值及匀速值。停下后的静止角只提供静摩擦平衡条件，不得把 m·g·L·sin(theta_stop) 直接等同库仑摩擦参数。"
      - "3. 每个已批准载荷/方向重复并记录原始数据、离散度和不确定度；两颗抽测只能筛查差异，不能代表15颗寿命或额定。同步BN08固定力臂的挠度/回差测量。"
      - "4. 拟合时保留独立验证轨迹，并把侧向载荷、起动与运行摩擦区分。若只有指令电流而无电流-扭矩校准，不把它当作实测力矩。将测量与任务所需低速跟踪、连续输出及温升预算对比。"
      - "撤销旧方案：960 g置于96 mm摆臂可产生0.904 N·m重力驱动矩，在58°约0.767 N·m，已高于现有0.66 N·m峰值测量；不能只按偏出平面的侧弯矩设计该自由落测试。"
    criterion:
      - "旧0.08/0.12 N·m分档没有任务或连续能力依据，撤销为放行阈值；DR覆盖一个参数并不证明真实关节可靠。缺少有效实测、任务跟踪预算或连续输出曲线时保持未验证。"
      - "以每个任务的速度/加速度/外载荷及冷、热状态评估：连续可用力矩须覆盖重力、惯性与保守摩擦；低速换向误差、温升、BN08回差/磨损均须达标，数值门槛由任务与可追溯能力给出，未建立不得填通过。"
      - "若数据支持参数变更，同步所有实际训练变体及BAM文件并复验；bam_params_sync绿色只证明其声明范围的参数一致，不证明完整功能。若刚度、回差、摩擦或耐久超出任务预算，则重设支撑/配合/预紧并重训，不直接装回已互撞的旧6704位置。"
    backfill_to:
      - "V2_S288版发布产物/04_电机到货测试/params/s288/m1.json:friction_base（同步包内 s288_m1.json，L6 _simmodel/bam_params_sync 核三处一致）"
      - "tolerances.yaml:load.servo_output_bearing（rated_radial_N 仍 null；本条只给摩擦-弯矩斜率，不给额定）"
    value_status: "proposed"
    checked: false
    result: null
    depends_on_arrival: ["S288（已到）", "测试台 TB01–TB03（已打）", "BN16 管脚实测做完"]
    blocking_before: "sim2real 上实机前必须做完；不挡仿真训练开始"
    can_be_done_today: true
  - id: BN19
    title: B03顶盖/B01后门卡合、跌落及实物抽插
    why_not_offline: PETG弹性、打印公差、疲劳、线束/胶带以及实际保持力离线无法证明
    criterion:
    - 用行李秤记录盖抗掀力、门后拉力、仅卡珠门保持力；在任务所需载荷门槛尚未确认前只记录，不填通过
    - 装电池背朝下30cm硬地跌落10次、趴/仰起立20次、走路10分钟：盖/门不能松脱，不能掉电
    - 盖面高出原壳≤0.2mm；插头与平衡头/胶带/余线收好不顶盖
    - 实物电池带拉环和贴顶两头：抽出/推入各10次，不刮线、不卡，拉环不脱；量实际宽/厚/放电线与平衡头三围
    - 前舌名义0.25mm下挠必须检查PETG裂纹、永久变形及重复滑装保持力；记录材料/层向/温度，不借PLA桶放行
