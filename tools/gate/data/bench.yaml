    title: "耐久与接地：6 处未恢复滚动支承的运动关节及已恢复支承的松旷/磨损"
    why_not_offline: "comparison A2/C2 的实机一半：悬臂载荷下 S288 自带输出轴承与 PLA 滑配的长期表现"
    criterion:
      - "行走 30 min 的初筛必须包含髋横滚×2（09-17 r5 取消6704后新增）、髋俯仰×2、头偏航×1、头横滚 A 端×1 共6处；在固定测量臂长/加载力下记录径向旷量，旧拟议增量≤0.2 mm只作初筛，不构成完整寿命承诺。嘴不做，不计入测试关节。髋偏航×2、膝×2、踝×2、头横滚B还要检查轴承松动。"
      - "S288 输出轴无可感轴向窜动（手感 + 千分表 ≤0.1 mm）"
      - "头横滚 A 滑配面及 B 端 N04 轴颈/内圈界面无可见磨屑或爬动；记录正反向启动/运转力矩及冷机/热机差。原拟议变化≤30%仅作初筛，需同时满足任务的最低可控力矩预算。"
      - "任一关节超标 → 阻止放行，重设支撑/配合/紧固或补滚动轴承，再完整复测；不能未经空间验证直接装回已互撞的髋横滚6704。"
      - "按 docs/训练计划_2026-09-17.md 覆盖行走、站立、起坐、拾取、左右踢球、翻滚及动作切换；同时记录跟踪误差、回差、供电压降、实测/可追溯电流与温度。缺少实机结果不能声明完整功能正常。"
      - "不得以电机堵转/峰值扭矩替代连续可用扭矩，不得以727.7 g占位模型或静态280/394 Nmm代替落地冲击和实际头部载荷。"
    corrected_2026-09-09: "原文写髋偏航/髋俯仰/颈/头俯仰，与 comparison A2 改正后的名单不符。原版 11 颗 Ø22 的位置是 髋偏航×2 髋横滚×2 髋俯仰×2 膝×2 头偏航×1 头横滚×2 —— 颈俯仰与头俯仰一颗都没有。审查 Codex01（体系审查_Codex01.md:122）发现。"
